<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build your box | AJ's Bakery</title>
  <meta name="description" content="Build a box of 3, 6 or 12 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png?v=3">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="site.webmanifest?v=3">
  <!-- The two fonts are self-hosted; preloading the Latin files means text is drawn in them from the first paint -->
  <link rel="preload" href="assets/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2B4C93">
  <link rel="canonical" href="https://ajs-bakery.vercel.app/box.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AJ's Bakery">
  <meta property="og:title" content="Build your box | AJ's Bakery">
  <meta property="og:description" content="Build a box of 3, 6 or 12 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <meta property="og:url" content="https://ajs-bakery.vercel.app/box.html">
  <meta property="og:image" content="https://ajs-bakery.vercel.app/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Freshly baked Bueno Mucho cookies from AJ's Bakery">
  <meta property="og:locale" content="en_PH">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Build your box | AJ's Bakery">
  <meta name="twitter:description" content="Build a box of 3, 6 or 12 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <meta name="twitter:image" content="https://ajs-bakery.vercel.app/assets/og-image.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#builder">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="logo-link" href="/">
        <img data-asset="logo" alt="" width="56" height="56" sizes="56px" onerror="this.style.display='none'">
        <span>AJ's Bakery</span>
      </a>
      <div class="header-actions">
        <button type="button" class="cart-btn" data-open-cart aria-label="Open your cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
            <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H6"/>
          </svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="order-banner compact sticker" id="order-banner">Checking this week's Sunday...</div>

  <main class="container builder" id="builder" tabindex="-1">
    <a class="back-link-sm" href="index.html#boxes">&larr; Boxes</a>
    <p class="loading">Loading your box...</p>
  </main>

  <script type="module">
    import { CONFIG } from "./js/config.js";
    import { fetchMenu, fetchSundayInfo, fetchAvailability, fetchSiteSettings } from "./js/supabase.js";
    import { orderingSunday, renderBanner, renderBannerError, renderClosed, flavorPhoto, stockLabel, peso, esc, boxSavings, trackBarHeight } from "./js/ui.js";
    import * as cart from "./js/cart.js";
    import { initCartUI, openCart } from "./js/cart-ui.js";
    import { initFlavorSheet } from "./js/flavor-sheet.js";

    initCartUI({ showBar: false });   // the builder has its own sticky bar; the header cart button still opens the cart
    const root = document.getElementById("builder");

    // Banner loads on its own; the builder doesn't depend on it
    fetchSundayInfo()
      .then((info) => {
        const ordering = orderingSunday(info);
        renderBanner(document.getElementById("order-banner"), ordering, { compact: true });
        cart.rememberSunday(ordering.date);   // so checkout can warn if the Sunday changes later
      })
      .catch((err) => { console.error(err); renderBannerError(document.getElementById("order-banner")); });

    try {
      // The availability call is optional: if it fails the builder still works (the database enforces the caps anyway)
      const [{ flavors, boxes }, stock, settings] = await Promise.all([
        fetchMenu(),
        fetchAvailability().catch((err) => { console.error(err); return null; }),
        fetchSiteSettings().catch((err) => { console.error(err); return {}; }),   // optional: the sheet leaves the notes out if this fails
      ]);
      cart.syncWithMenu({ flavors, boxes });   // keep the cart's names/prices in line with today's menu
      // Only sizes in the boxes table (active ones) can be built. Anything else, including an old
      // ?size=4 link, gets a friendly message and a way back to all the boxes.
      const asked = new URLSearchParams(location.search).get("size");
      const box = boxes.find((b) => String(b.size) === asked);
      if (box) startBuilder(box, flavors, stock ? stock.bySlug : null, settings);
      else showSizePicker(boxes, asked, flavors);
    } catch (err) {
      console.error(err);
      renderClosed(root);   // can't reach the database: "Ordering is closed" + Instagram DM link
    }

    // No ?size= in the URL, or one that isn't on sale (an old link, a typo): let them pick one
    function showSizePicker(boxes, asked, flavors) {
      const unknown = asked !== null && asked !== "";
      document.title = "Pick a box | AJ's Bakery";
      root.innerHTML = `
        <a class="back-link-sm" href="index.html#boxes">&larr; All boxes</a>
        <h1>${unknown ? "That box isn't available" : "Pick a box size"}</h1>
        ${unknown ? `<p class="builder-msg" role="status">We don't have a box of ${esc(asked.slice(0, 6))} right now. Here's what we've got:</p>` : ""}
        <div class="box-picker"><div class="card-grid">${boxes.map((b) => `
          <article class="card box-card"><div class="card-body">
            <div class="box-size">Box of ${b.size}</div>
            <div class="price">${peso(b.price)}</div>
            ${boxSavings(b, flavors) ? `<span class="save-badge">Save ${peso(boxSavings(b, flavors))} vs singles</span>` : ""}
            <p class="box-desc">${esc(b.description || "")}</p>
            <a class="btn" href="box.html?size=${b.size}">Build this box</a>
          </div></article>`).join("")}</div></div>
        <p><a href="index.html#boxes">&larr; Back to all boxes</a></p>`;
    }

    function startBuilder(box, flavors, availability, settings) {
      document.title = `Build your box of ${box.size} | AJ's Bakery`;
      const qty = Object.fromEntries(flavors.map((f) => [f.slug, 0]));
      const chosen = () => Object.values(qty).reduce((a, b) => a + b, 0);

      // How many of this flavor can go in THIS box: what's left this Sunday, minus what's
      // already in the cart (other boxes and single cookies). null availability = unknown, no limit.
      const limitFor = (slug) =>
        availability && availability[slug] ? Math.max(0, availability[slug].remaining - cart.flavorQty(slug)) : box.size;

      root.innerHTML = `
        <div class="builder-head">
          <a class="back-link-sm" href="index.html#boxes" aria-label="Back to all boxes">&larr; Boxes</a>
          <h1>Build your box of ${box.size}</h1>
        </div>

        <div class="counter" aria-live="polite">
          <div class="counter-top">
            <span><strong id="chosen">0</strong> of ${box.size} chosen</span>
            <small>Pick any mix of flavors. Exactly ${box.size} cookies.</small>
          </div>
          <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
        </div>
        <p class="builder-msg" id="builder-msg" aria-live="polite"></p>

        <ul class="flavor-list">
          ${flavors.map((f) => `
          <li class="flavor-row" data-slug="${esc(f.slug)}">
            <div class="flavor-emoji">${flavorPhoto(f, "flavor-thumb", { width: 240, height: 240, sizes: "56px" })}</div>
            <div class="flavor-info">
              <!-- the name opens the same detail sheet as on the home page -->
              <strong><button type="button" class="card-open" data-open-sheet aria-haspopup="dialog">${esc(f.name)}</button></strong>
              <span class="flavor-meta">
                <span class="stock sticker" data-stock hidden></span>
                ${f.surcharge > 0 ? `<span class="surcharge">+${peso(f.surcharge)} each</span>` : ""}
              </span>
            </div>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="Remove one ${esc(f.name)}">&minus;</button>
              <output aria-label="${esc(f.name)} quantity">0</output>
              <button type="button" data-step="1" aria-label="Add one ${esc(f.name)}">+</button>
            </div>
            <small class="soldout-note" data-soldout-note hidden>Unpaid orders release after 24 hours, so check back.</small>
          </li>`).join("")}
        </ul>

        <button type="button" class="link-btn gift-toggle" id="gift-toggle" aria-expanded="false" aria-controls="gift-wrap">+ Add a gift note</button>
        <div id="gift-wrap" hidden>
          <label class="gift-label" for="gift-note">Gift note <span>(optional)</span></label>
          <textarea id="gift-note" maxlength="500" rows="3" placeholder="Happy birthday, Tita! Love, Ana"></textarea>
        </div>`;

      // The sticky bottom bar: "2 of 12 chosen · ₱1080 · [Add to cart]". The button stays disabled until the count matches.
      document.querySelector(".builder-bar")?.remove();
      const bar = document.createElement("div");
      bar.className = "builder-bar";
      bar.innerHTML = `
        <div class="builder-bar-info">
          <div><strong id="bar-count">0 of ${box.size}</strong> chosen · <span id="bar-price">${peso(box.price)}</span></div>
          <small id="price-note"></small>
        </div>
        <button type="button" class="btn" id="add-btn" disabled>Add to cart</button>`;
      document.body.append(bar);
      document.body.classList.add("has-builder-bar");
      trackBarHeight(bar);

      const $ = (id) => document.getElementById(id);

      // Gift note stays out of the way until asked for
      $("gift-toggle").addEventListener("click", () => {
        const open = $("gift-wrap").hidden;
        $("gift-wrap").hidden = !open;
        $("gift-toggle").setAttribute("aria-expanded", String(open));
        $("gift-toggle").textContent = open ? "− Hide gift note" : ($("gift-note").value ? "+ Gift note added (tap to edit)" : "+ Add a gift note");
        if (open) $("gift-note").focus();
      });

      // Items in the cart's format, from the current quantities
      const items = () => flavors.map((f) => ({ slug: f.slug, name: f.name, surcharge: f.surcharge, qty: qty[f.slug] }));

      // Redraw numbers and enable/disable buttons (rows are NOT re-created, so focus stays put)
      function refresh() {
        const n = chosen();
        const full = n === box.size;
        const surcharge = cart.priceFor(box.price, items()) - box.price;

        $("chosen").textContent = n;
        $("bar-count").textContent = `${n} of ${box.size}`;
        $("progress-fill").style.width = `${(n / box.size) * 100}%`;
        $("bar-price").textContent = peso(cart.priceFor(box.price, items()));
        const extras = flavors.filter((f) => f.surcharge > 0 && qty[f.slug] > 0).map((f) => f.name);
        $("price-note").textContent = surcharge > 0 ? `includes ${peso(surcharge)} extra for ${extras.join(" + ")}` : "";

        let available = 0;   // cookies still available across all flavors (for this box)
        root.querySelectorAll(".flavor-row").forEach((row) => {
          const slug = row.dataset.slug;
          const q = qty[slug];
          const limit = limitFor(slug);
          available += limit;
          const left = availability && availability[slug] ? availability[slug].remaining : null;
          const label = left !== null && left <= 0 ? "Sold out" : left !== null && left <= 5 ? `Only ${left} left` : "";
          const badge = row.querySelector("[data-stock]");
          badge.textContent = label; badge.hidden = !label;
          badge.classList.toggle("stock-out", left !== null && left <= 0);
          row.classList.toggle("is-soldout", left !== null && left <= 0);
          const note = row.querySelector("[data-soldout-note]");
          if (note) note.hidden = !(left !== null && left <= 0);
          row.querySelector("output").textContent = q;
          row.querySelector('[data-step="-1"]').disabled = q === 0;
          // + stops at the box size AND at the flavor's remaining limit
          row.querySelector('[data-step="1"]').disabled = full || q >= limit;
        });
        const notEnough = available < box.size;

        const addBtn = $("add-btn");
        const cartFull = cart.isFull();
        addBtn.disabled = !full || cartFull || notEnough;
        addBtn.textContent = cartFull ? "Cart full"
          : notEnough ? "Not enough left"
          : full ? "Add to cart"
          : `Pick ${box.size - n} more`;
        $("builder-msg").textContent = notEnough
          ? (available === 0 ? "Sold out for this Sunday." : `Only ${available} cookie${available === 1 ? "" : "s"} left, not enough for a box of ${box.size}.`)
          : cartFull
          ? `You can order up to ${CONFIG.maxBoxesPerOrder} boxes at a time. Remove one from your cart to add another.`
          : "";
      }

      // The same detail sheet as the home page, opened by tapping a flavor's name.
      // (Its stepper adds loose single cookies to the cart; the box itself is built with the + / - buttons.)
      const sheet = initFlavorSheet({
        flavors,
        getRemaining: (slug) => (availability && availability[slug] ? availability[slug].remaining : null),
        getLimit: (slug) => (availability && availability[slug] ? Math.max(0, availability[slug].remaining - cart.flavorQty(slug)) : CONFIG.maxCookiesInCart),
        settings,
        add: (flavor, qty) => cart.addSingle(flavor, qty),
      });

      // One listener for every + / - button (and the flavor names)
      root.querySelector(".flavor-list").addEventListener("click", (e) => {
        const nameBtn = e.target.closest("[data-open-sheet]");
        if (nameBtn) return sheet.open(nameBtn.closest(".flavor-row").dataset.slug);
        const btn = e.target.closest("[data-step]");
        if (!btn) return;
        const slug = btn.closest(".flavor-row").dataset.slug;
        const next = qty[slug] + Number(btn.dataset.step);
        if (next < 0 || (next > qty[slug] && (chosen() >= box.size || next > limitFor(slug)))) return;
        qty[slug] = next;
        refresh();
      });

      $("add-btn").addEventListener("click", () => {
        const result = cart.add({
          size: box.size,
          boxPrice: box.price,
          items: items(),
          giftNote: $("gift-note").value,
        });
        if (!result.ok) { $("builder-msg").textContent = result.error; return; }
        // Ask the database for fresh stock (someone else may have bought some while we browsed)
        fetchAvailability().then((st) => { availability = st.bySlug; refresh(); }).catch((err) => console.error(err));
        // Reset the builder so they can make another box, then show the cart
        flavors.forEach((f) => (qty[f.slug] = 0));
        $("gift-note").value = "";
        $("gift-wrap").hidden = true; $("gift-toggle").setAttribute("aria-expanded", "false"); $("gift-toggle").textContent = "+ Add a gift note";
        refresh();
        openCart();
      });

      window.addEventListener("cart:changed", () => { refresh(); sheet.refresh(); }); // cart-full state can change (e.g. Remove)
      refresh();
    }
  </script>
</body>
</html>
