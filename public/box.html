<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build your box | AJ's Bakery</title>
  <meta name="description" content="Build a box of 4 or 6 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#3a72b8">
  <link rel="canonical" href="https://ajs-bakery-site.vercel.app/box.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AJ's Bakery">
  <meta property="og:title" content="Build your box | AJ's Bakery">
  <meta property="og:description" content="Build a box of 4 or 6 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <meta property="og:url" content="https://ajs-bakery-site.vercel.app/box.html">
  <meta property="og:image" content="https://ajs-bakery-site.vercel.app/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Freshly baked Bueno Mucho cookies from AJ's Bakery">
  <meta property="og:locale" content="en_PH">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Build your box | AJ's Bakery">
  <meta name="twitter:description" content="Build a box of 4 or 6 brown butter cookies. Pick your flavors and order for Sunday pickup or delivery in Metro Manila.">
  <meta name="twitter:image" content="https://ajs-bakery-site.vercel.app/assets/og-image.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#builder">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="logo-link" href="index.html">
        <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
        <span>AJ's Bakery</span>
      </a>
      <button type="button" class="cart-btn" data-open-cart aria-label="Open your cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
          <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H6"/>
        </svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="order-banner" id="order-banner">Checking this week's Sunday...</div>

  <main class="container builder" id="builder" tabindex="-1">
    <a class="back-link" href="index.html#boxes">&larr; All boxes</a>
    <p class="loading">Loading your box...</p>
  </main>

  <script type="module">
    import { CONFIG } from "./js/config.js";
    import { fetchMenu, fetchSundayInfo, fetchAvailability } from "./js/supabase.js";
    import { orderingSunday, renderBanner, renderBannerError, renderClosed, flavorPhoto, stockLabel, peso, esc } from "./js/ui.js";
    import * as cart from "./js/cart.js";
    import { initCartUI, openCart } from "./js/cart-ui.js";

    initCartUI();
    const root = document.getElementById("builder");

    // Banner loads on its own; the builder doesn't depend on it
    fetchSundayInfo()
      .then((info) => {
        const ordering = orderingSunday(info);
        renderBanner(document.getElementById("order-banner"), ordering);
        cart.rememberSunday(ordering.date);   // so checkout can warn if the Sunday changes later
      })
      .catch((err) => { console.error(err); renderBannerError(document.getElementById("order-banner")); });

    try {
      // The availability call is optional: if it fails the builder still works (the database enforces the caps anyway)
      const [{ flavors, boxes }, stock] = await Promise.all([
        fetchMenu(),
        fetchAvailability().catch((err) => { console.error(err); return null; }),
      ]);
      cart.syncWithMenu({ flavors, boxes });   // keep the cart's names/prices in line with today's menu
      const size = Number(new URLSearchParams(location.search).get("size"));
      const box = boxes.find((b) => b.size === size);
      if (!box) showSizePicker(boxes); else startBuilder(box, flavors, stock ? stock.bySlug : null);
    } catch (err) {
      console.error(err);
      renderClosed(root);   // can't reach the database: "Ordering is closed" + Instagram DM link
    }

    // No (or unknown) ?size= in the URL: let them pick one
    function showSizePicker(boxes) {
      root.innerHTML = `
        <a class="back-link" href="index.html#boxes">&larr; All boxes</a>
        <h1>Pick a box size</h1>
        <div class="card-grid">${boxes.map((b) => `
          <article class="card box-card"><div class="card-body">
            <div class="box-size">Box of ${b.size}</div>
            <div class="price">${peso(b.price)}</div>
            <a class="btn" href="box.html?size=${b.size}">Build this box</a>
          </div></article>`).join("")}</div>`;
    }

    function startBuilder(box, flavors, availability) {
      document.title = `Build your box of ${box.size} | AJ's Bakery`;
      const qty = Object.fromEntries(flavors.map((f) => [f.slug, 0]));
      const chosen = () => Object.values(qty).reduce((a, b) => a + b, 0);

      // How many of this flavor can go in THIS box: what's left this Sunday, minus what's
      // already in the cart (other boxes and single cookies). null availability = unknown, no limit.
      const limitFor = (slug) =>
        availability && availability[slug] ? Math.max(0, availability[slug].remaining - cart.flavorQty(slug)) : box.size;

      root.innerHTML = `
        <a class="back-link" href="index.html#boxes">&larr; All boxes</a>
        <h1>Build your box of ${box.size}</h1>
        <p class="section-sub">Pick any mix of flavors. Your box needs exactly ${box.size} cookies.</p>

        <div class="counter" aria-live="polite">
          <span><strong id="chosen">0</strong> of ${box.size} chosen</span>
          <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
        </div>

        <ul class="flavor-list">
          ${flavors.map((f) => `
          <li class="flavor-row" data-slug="${esc(f.slug)}">
            <div class="flavor-emoji">${flavorPhoto(f.slug, f.name, "flavor-thumb")}</div>
            <div class="flavor-info">
              <strong>${esc(f.name)}</strong>
              <span class="stock" data-stock hidden></span>
              ${f.surcharge > 0 ? `<span class="surcharge">+${peso(f.surcharge)} each</span>` : ""}
            </div>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="Remove one ${esc(f.name)}">&minus;</button>
              <output aria-label="${esc(f.name)} quantity">0</output>
              <button type="button" data-step="1" aria-label="Add one ${esc(f.name)}">+</button>
            </div>
          </li>`).join("")}
        </ul>

        <label class="gift-label" for="gift-note">Gift note <span>(optional)</span></label>
        <textarea id="gift-note" maxlength="500" rows="3" placeholder="Happy birthday, Tita! Love, Ana"></textarea>

        <div class="live-price">
          <span class="price" id="price">${peso(box.price)}</span>
          <small id="price-note"></small>
        </div>
        <button type="button" class="btn btn-block" id="add-btn" disabled></button>
        <p class="builder-msg" id="builder-msg" aria-live="polite"></p>`;

      const $ = (id) => document.getElementById(id);

      // Items in the cart's format, from the current quantities
      const items = () => flavors.map((f) => ({ slug: f.slug, name: f.name, surcharge: f.surcharge, qty: qty[f.slug] }));

      // Redraw numbers and enable/disable buttons (rows are NOT re-created, so focus stays put)
      function refresh() {
        const n = chosen();
        const full = n === box.size;
        const surcharge = cart.priceFor(box.price, items()) - box.price;

        $("chosen").textContent = n;
        $("progress-fill").style.width = `${(n / box.size) * 100}%`;
        $("price").textContent = peso(cart.priceFor(box.price, items()));
        const extras = flavors.filter((f) => f.surcharge > 0 && qty[f.slug] > 0).map((f) => f.name);
        $("price-note").textContent = surcharge > 0 ? `includes ${peso(surcharge)} extra for ${extras.join(" + ")}` : "";

        let available = 0;   // cookies still available across all flavors (for this box)
        root.querySelectorAll(".flavor-row").forEach((row) => {
          const slug = row.dataset.slug;
          const q = qty[slug];
          const limit = limitFor(slug);
          available += limit;
          const left = availability && availability[slug] ? availability[slug].remaining : null;
          const label = stockLabel(left);
          const badge = row.querySelector("[data-stock]");
          badge.textContent = label; badge.hidden = !label;
          badge.classList.toggle("stock-out", left !== null && left <= 0);
          row.classList.toggle("is-soldout", left !== null && left <= 0);
          row.querySelector("output").textContent = q;
          row.querySelector('[data-step="-1"]').disabled = q === 0;
          // + stops at the box size AND at the flavor's remaining limit
          row.querySelector('[data-step="1"]').disabled = full || q >= limit;
        });
        const notEnough = available < box.size;

        const addBtn = $("add-btn");
        const cartFull = cart.isFull();
        addBtn.disabled = !full || cartFull || notEnough;
        addBtn.textContent = cartFull ? "Your cart is full"
          : notEnough ? "Not enough left"
          : full ? `Add to cart · ${peso(cart.priceFor(box.price, items()))}`
          : `Pick ${box.size - n} more`;
        $("builder-msg").textContent = notEnough
          ? `Only ${available} cookie${available === 1 ? "" : "s"} left for this Sunday, not enough for a box of ${box.size}.`
          : cartFull
          ? `You can order up to ${CONFIG.maxBoxesPerOrder} boxes at a time. Remove one from your cart to add another.`
          : "";
      }

      // One listener for every + / - button
      root.querySelector(".flavor-list").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-step]");
        if (!btn) return;
        const slug = btn.closest(".flavor-row").dataset.slug;
        const next = qty[slug] + Number(btn.dataset.step);
        if (next < 0 || (next > qty[slug] && (chosen() >= box.size || next > limitFor(slug)))) return;
        qty[slug] = next;
        refresh();
      });

      $("add-btn").addEventListener("click", () => {
        const result = cart.add({
          size: box.size,
          boxPrice: box.price,
          items: items(),
          giftNote: $("gift-note").value,
        });
        if (!result.ok) { $("builder-msg").textContent = result.error; return; }
        // Reset the builder so they can make another box, then show the cart
        flavors.forEach((f) => (qty[f.slug] = 0));
        $("gift-note").value = "";
        refresh();
        openCart();
      });

      window.addEventListener("cart:changed", refresh); // cart-full state can change (e.g. Remove)
      refresh();
    }
  </script>
</body>
</html>
