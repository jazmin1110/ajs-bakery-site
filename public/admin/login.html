<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin login | AJ's Bakery</title>
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png?v=2">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#3a72b8">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <span class="logo-link"><img src="../assets/logo.png?v=2" alt="" width="48" height="48"><span>AJ's Bakery · Admin</span></span>
    </div>
  </header>

  <main class="container checkout">
    <h1>Admin login</h1>
    <div class="form-error" id="denied" hidden>Not authorized. That account isn't an admin.</div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="error" role="alert" hidden></div>
      <button type="submit" class="btn btn-block" id="login-btn">Log in</button>
    </form>
  </main>

  <script type="module">
    import { getClient, isConfigured } from "../js/supabase.js";

    const $ = (id) => document.getElementById(id);
    const showError = (msg) => { $("error").textContent = msg; $("error").hidden = false; };

    if (new URLSearchParams(location.search).has("denied")) $("denied").hidden = false;
    if (!isConfigured()) showError("The site isn't connected to its database yet.");

    // Already logged in as an admin? Go straight to the orders.
    (async () => {
      if (!isConfigured()) return;
      const sb = getClient();
      const { data } = await sb.auth.getSession();
      if (!data.session) return;
      const { data: ok } = await sb.rpc("is_admin");
      if (ok === true) location.replace("orders.html");
    })();

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("error").hidden = true; $("denied").hidden = true;
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) return showError("Please enter your email and password.");

      const btn = $("login-btn");
      btn.disabled = true; btn.textContent = "Logging in...";
      try {
        const sb = getClient();
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          // Same message for "no such user" and "wrong password" on purpose
          showError(error.status === 400 || error.status === 401 || /invalid/i.test(error.message)
            ? "Wrong email or password." : "Couldn't log in right now. Please try again.");
          return;
        }
        // Logged in. Are they actually an admin? (The database decides.)
        const { data: ok, error: adminErr } = await sb.rpc("is_admin");
        if (adminErr || ok !== true) {
          await sb.auth.signOut();
          $("denied").hidden = false;
          return;
        }
        location.replace("orders.html");
      } catch (err) {
        console.error(err);
        showError("Couldn't reach the server. Check your connection and try again.");
      } finally {
        btn.disabled = false; btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
