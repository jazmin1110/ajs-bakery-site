<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Orders | AJ's Bakery admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64.png?v=3">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="../site.webmanifest?v=3">
  <!-- The two fonts are self-hosted; preloading the Latin files means text is drawn in them from the first paint -->
  <link rel="preload" href="../assets/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2B4C93">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin">

  <header class="site-header no-print">
    <div class="container admin-head">
      <a class="logo-link" href="/"><img src="../assets/stickers/logo-badge-new-96.webp" srcset="../assets/stickers/logo-badge-new-96.webp 96w, ../assets/stickers/logo-badge-new-192.webp 192w" sizes="56px" alt="" width="56" height="56"><span>AJ's Admin</span></a>
      <nav class="admin-nav" id="admin-nav" aria-label="Admin"></nav>
    </div>
  </header>

  <main class="container admin-main">
    <div class="toolbar no-print">
      <label class="toolbar-label" for="sunday">Sunday</label>
      <select id="sunday"></select>
      <button type="button" class="btn btn-small" id="packing-btn">Packing view</button>
    </div>

    <div class="chips no-print" id="chips" role="group" aria-label="Filter by payment status"></div>
    <div class="chips no-print" id="chips2" role="group" aria-label="Filter by progress (paid orders)"></div>

    <div class="ops-ok ops-flash no-print" id="flash" role="status" hidden></div>

    <div class="form-error" id="message" role="alert" hidden></div>
    <div id="list"><p class="loading">Loading orders...</p></div>
  </main>

  <script type="module">
    import {
      requireAdmin, renderNav, setupSundayPicker, selectedSunday, expireStale, loadOrders, setStatus,
      formatWhen, timeLeft, singlesPack, rpc,
    } from "../js/admin.js";
    import { esc, peso, formatSunday } from "../js/ui.js";

    await requireAdmin();
    renderNav("orders");

    const $ = (id) => document.getElementById(id);
    let orders = [];
    let filter = "all";
    let packing = false;
    let sunday = selectedSunday();
    let progress = "all";                 // progress filter (only looks at paid orders)
    const openRefs = new Set();           // which "Delivery & notes" sections are open, so a refresh doesn't close them

    const STATUS_LABEL = { pending: "Pending", paid: "Paid", cancelled: "Cancelled", expired: "Expired" };

    // Order progress (only for PAID orders): new > baking > ready > out for delivery > completed
    const PREP_LABEL = { new: "To do", baking: "Baking", ready: "Ready", out_for_delivery: "Out for delivery", completed: "Done" };
    const prepName = (o) => o.prep_status === "completed" ? (o.fulfillment === "delivery" ? "Delivered" : "Picked up") : PREP_LABEL[o.prep_status];
    // The one button that moves the order forward
    function nextStep(o) {
      const delivery = o.fulfillment === "delivery";
      return {
        new:               { to: "baking", label: "Start baking" },
        baking:            { to: "ready", label: "Mark ready" },
        ready:             delivery ? { to: "out_for_delivery", label: "Out for delivery" } : { to: "completed", label: "Picked up" },
        out_for_delivery:  { to: "completed", label: "Delivered" },
      }[o.prep_status];
    }
    // One step back, for mis-taps
    function prevStep(o) {
      return { baking: "new", ready: "baking", out_for_delivery: "ready",
               completed: o.fulfillment === "delivery" ? "out_for_delivery" : "ready" }[o.prep_status];
    }

    function flash(text) {
      $("flash").textContent = text; $("flash").hidden = false;
      clearTimeout(flash.t); flash.t = setTimeout(() => { $("flash").hidden = true; }, 2500);
    }

    function showMessage(text) {
      $("message").textContent = text || "";
      $("message").hidden = !text;
      if (text) $("message").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ---- Loading ------------------------------------------------------------------------
    async function load() {
      showMessage("");
      $("list").innerHTML = `<p class="loading">Loading orders...</p>`;
      try {
        // Mark overdue unpaid orders as expired first, so what you see is up to date
        try { await expireStale(); } catch (e) { console.error("expire failed", e); }
        orders = await loadOrders(sunday);
        render();
      } catch (err) {
        console.error(err);
        $("list").innerHTML = "";
        showMessage(err.isNetwork ? "Couldn't reach the server. Check your connection and refresh."
                                   : `Couldn't load orders: ${err.message}`);
      }
    }

    // ---- Drawing ------------------------------------------------------------------------
    function boxesHtml(o) {
      return o.boxes.map((b) => `
        <div class="o-box">
          <strong>Box ${b.position}: box of ${b.size}</strong>
          <div>${b.items.map((i) => `${i.qty} × ${esc(i.name)}`).join("<br>")}</div>
          ${b.gift_note ? `<div class="o-note">🎁 ${esc(b.gift_note)}</div>` : ""}
        </div>`).join("");
    }

    // Loose single cookies (not in a box): "Single cookies (3): 2 × Chimp Chips ..."
    const singlesCount = (o) => (o.singles || []).reduce((n, s) => n + s.qty, 0);
    function singlesHtml(o, packing = false) {
      if (!(o.singles || []).length) return "";
      const n = singlesCount(o);
      return `
        <div class="o-box">
          <strong>${packing ? `Singles: ${esc(singlesPack(n))}` : `Single cookies (${n})`}</strong>
          <div>${o.singles.map((s) => `${s.qty} × ${esc(s.name)}${packing ? "" : ` <span class="o-small">(${peso(s.unit_price)} each)</span>`}`).join("<br>")}</div>
        </div>`;
    }

    // Overdue pending orders count as expired for colouring, even if the flip hasn't happened yet.
    // "overdue" comes from the database clock, so this phone's clock/timezone can't skew it.
    const effectiveStatus = (o) => (o.overdue ? "expired" : o.status);

    function orderCard(o) {
      const status = effectiveStatus(o);
      const needsCheck = status === "pending" && !!o.gcash_ref;       // customer says they paid
      const cls = needsCheck ? "needs-check" : status === "expired" ? "is-expired" : `is-${status}`;
      const ig = o.ig_handle ? o.ig_handle.replace(/^@/, "") : "";
      const phoneDigits = o.phone.replace(/[^\d+]/g, "");

      return `
      <article class="order-card ${cls}" data-ref="${esc(o.ref_code)}">
        <div class="o-top">
          <span class="o-ref">${esc(o.ref_code)}</span>
          <span class="badge badge-${status}">${esc(needsCheck ? "Check payment" : STATUS_LABEL[status])}</span>
        </div>
        <p class="o-who"><strong>${esc(o.name)}</strong>
          ${ig ? ` · <a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>` : ""}
          · <a href="tel:${esc(phoneDigits)}">${esc(o.phone)}</a></p>
        <p class="o-meta">${o.fulfillment === "delivery"
          ? `🚚 Delivery: ${esc(o.address || "(no address)")}` : "🏠 Pickup"}</p>
        ${boxesHtml(o)}
        ${singlesHtml(o)}
        <p class="o-meta"><strong>${peso(o.total)}</strong>
          · GCash ref: ${o.gcash_ref ? `<strong>${esc(o.gcash_ref)}</strong>` : "<em>none yet</em>"}</p>
        <p class="o-meta o-small">Ordered ${esc(formatWhen(o.created_at))}${status === "pending" ? ` · ${esc(timeLeft(o.seconds_left))}` : ""}</p>
        ${deliverySummary(o)}
        ${status === "paid" ? progressHtml(o) : ""}
        ${status === "cancelled" || status === "expired" ? "" : detailsHtml(o)}
        <div class="o-actions no-print">
          ${status === "paid" ? "" : `<button type="button" class="btn btn-small" data-act="paid">Mark paid</button>`}
          ${status === "cancelled" ? "" : `<button type="button" class="btn btn-small btn-danger" data-act="cancelled">Cancel</button>`}
          ${status === "cancelled" || status === "expired" ? `<button type="button" class="btn btn-small btn-ghost" data-act="pending">Reopen</button>` : ""}
        </div>
      </article>`;
    }

    // "🚚 Lalamove · 3-4pm · LLM-123" and the internal note, if any were saved
    function deliverySummary(o) {
      const bits = [o.courier, o.delivery_slot, o.delivery_ref].filter(Boolean);
      return (bits.length ? `<p class="o-meta">🚚 ${bits.map(esc).join(" · ")}</p>` : "")
           + (o.admin_note ? `<p class="o-meta o-small">📝 ${esc(o.admin_note)}</p>` : "");
    }

    // Progress badge + the button that moves the order to its next step
    function progressHtml(o) {
      const next = nextStep(o), prev = prevStep(o);
      return `<div class="o-actions no-print">
        <span class="badge badge-prep-${esc(o.prep_status)}">${esc(prepName(o))}</span>
        ${next ? `<button type="button" class="btn btn-small" data-prep="${next.to}">${esc(next.label)}</button>` : ""}
        ${prev ? `<button type="button" class="btn btn-small btn-ghost" data-prep="${prev}">Back a step</button>` : ""}
      </div>`;
    }

    // Courier / booking ref / time slot (delivery only) and an internal note
    function detailsHtml(o) {
      const delivery = o.fulfillment === "delivery";
      const v = (x) => esc(x || "");
      return `<details class="o-more no-print" data-ref-d="${esc(o.ref_code)}"${openRefs.has(o.ref_code) ? " open" : ""}>
        <summary>${delivery ? "Delivery &amp; notes" : "Notes"}</summary>
        <form class="ops-form" data-save-delivery>
          ${delivery ? `
          <div class="ops-field"><label>Courier</label><input name="courier" maxlength="60" placeholder="Lalamove, Grab..." value="${v(o.courier)}"></div>
          <div class="ops-field"><label>Time slot</label><input name="slot" maxlength="60" placeholder="3-4pm" value="${v(o.delivery_slot)}"></div>
          <div class="ops-field wide"><label>Booking number or tracking link</label><input name="ref" maxlength="300" value="${v(o.delivery_ref)}"></div>` : `
          <input type="hidden" name="courier" value="${v(o.courier)}"><input type="hidden" name="slot" value="${v(o.delivery_slot)}"><input type="hidden" name="ref" value="${v(o.delivery_ref)}">`}
          <div class="ops-field wide"><label>Note for yourself (customers never see this)</label><input name="note" maxlength="500" value="${v(o.admin_note)}"></div>
          <div class="wide"><button type="submit" class="btn btn-small">Save</button></div>
        </form>
      </details>`;
    }

    // One card per paid order: what to put in the box, who it's for, the note
    function packingCard(o) {
      return `
      <article class="pack-card">
        <div class="o-top"><span class="o-ref">${esc(o.ref_code)}</span>
          <span>${o.fulfillment === "delivery" ? "🚚 DELIVERY" : "🏠 PICKUP"}</span></div>
        <p class="o-who"><strong>${esc(o.name)}</strong>${o.ig_handle ? ` · ${esc(o.ig_handle)}` : ""} · ${esc(o.phone)}</p>
        ${o.fulfillment === "delivery" ? `<p class="o-meta">${esc(o.address || "")}</p>` : ""}
        ${deliverySummary(o)}
        ${boxesHtml(o)}
        ${singlesHtml(o, true)}
      </article>`;
    }

    function render() {
      const counts = { all: orders.length, pending: 0, paid: 0, cancelled: 0, expired: 0 };
      orders.forEach((o) => { counts[effectiveStatus(o)] += 1; });

      $("chips").innerHTML = ["all", "pending", "paid", "cancelled", "expired"].map((k) =>
        `<button type="button" class="chip" data-filter="${k}" aria-pressed="${filter === k}">${k === "all" ? "All" : STATUS_LABEL[k]} (${counts[k]})</button>`
      ).join("");

      // Progress chips count PAID orders only
      const paidOrders = orders.filter((o) => effectiveStatus(o) === "paid");
      const pc = { all: paidOrders.length };
      Object.keys(PREP_LABEL).forEach((k) => { pc[k] = paidOrders.filter((o) => o.prep_status === k).length; });
      $("chips2").innerHTML = paidOrders.length ? ["all", ...Object.keys(PREP_LABEL)].map((k) =>
        `<button type="button" class="chip" data-progress="${k}" aria-pressed="${progress === k}">${k === "all" ? "All paid" : PREP_LABEL[k]} (${pc[k]})</button>`
      ).join("") : "";

      $("packing-btn").textContent = packing ? "Back to orders" : "Packing view";

      if (packing) {
        const paid = orders.filter((o) => o.status === "paid");
        $("list").innerHTML = `
          <div class="pack-head">
            <h1>Packing list: ${esc(formatSunday(sunday))}</h1>
            <p>${paid.length} paid order${paid.length === 1 ? "" : "s"}</p>
            <button type="button" class="btn btn-small no-print" id="print-btn">Print</button>
          </div>
          ${paid.length ? paid.map(packingCard).join("") : `<p class="loading">No paid orders for this Sunday yet.</p>`}`;
        const p = $("print-btn"); if (p) p.addEventListener("click", () => window.print());
        return;
      }

      const shown = orders.filter((o) => (filter === "all" || effectiveStatus(o) === filter)
        && (progress === "all" || (effectiveStatus(o) === "paid" && o.prep_status === progress)));
      $("list").innerHTML = shown.length
        ? shown.map(orderCard).join("")
        : `<p class="loading">${orders.length ? "No orders with that status." : "No orders for this Sunday yet."}</p>`;
    }

    // ---- Events -------------------------------------------------------------------------
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest("[data-filter]"); if (!b) return;
      filter = b.dataset.filter; render();
    });

    $("chips2").addEventListener("click", (e) => {
      const b = e.target.closest("[data-progress]"); if (!b) return;
      progress = b.dataset.progress; render();
    });

    $("packing-btn").addEventListener("click", () => { packing = !packing; render(); });

    // Remember which "Delivery & notes" sections are open
    $("list").addEventListener("toggle", (e) => {
      const d = e.target.closest?.("[data-ref-d]"); if (!d) return;
      d.open ? openRefs.add(d.dataset.refD) : openRefs.delete(d.dataset.refD);
    }, true);

    // Save courier / slot / ref / note
    $("list").addEventListener("submit", async (e) => {
      const form = e.target.closest("[data-save-delivery]"); if (!form) return;
      e.preventDefault();
      const ref = form.closest("[data-ref]").dataset.ref;
      const f = new FormData(form);
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true; showMessage("");
      try {
        await rpc("admin_set_order_delivery", {
          p_ref_code: ref, p_courier: f.get("courier"), p_delivery_ref: f.get("ref"),
          p_delivery_slot: f.get("slot"), p_admin_note: f.get("note"),
        });
        orders = await loadOrders(sunday);
        render(); flash("Saved " + ref);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was saved." : err.message);
      }
    });

    // Mark paid / Cancel / Reopen (one listener for every card)
    $("list").addEventListener("click", async (e) => {
      const prepBtn = e.target.closest("[data-prep]");
      if (prepBtn) {                                           // Start baking / Mark ready / Out for delivery / ...
        const pref = prepBtn.closest("[data-ref]").dataset.ref;
        showMessage(""); prepBtn.disabled = true;
        try {
          await rpc("admin_set_order_prep", { p_ref_code: pref, p_prep: prepBtn.dataset.prep });
          orders = await loadOrders(sunday);
          render();
        } catch (err) {
          console.error(err);
          prepBtn.disabled = false;
          showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was changed." : err.message);
        }
        return;
      }
      const btn = e.target.closest("[data-act]"); if (!btn) return;
      const ref = btn.closest("[data-ref]").dataset.ref;
      const act = btn.dataset.act;
      if (act === "cancelled" && !confirm(`Cancel order ${ref}? Its cookies go back to the Sunday.`)) return;

      showMessage("");
      btn.disabled = true;
      try {
        await setStatus(ref, act);
        orders = await loadOrders(sunday);
        render();
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was changed." : err.message);
      }
    });

    setupSundayPicker($("sunday"), (d) => { sunday = d; load(); });
    load();
  </script>
</body>
</html>
