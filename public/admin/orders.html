<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Orders | AJ's Bakery admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64.png?v=3">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="../site.webmanifest?v=3">
  <!-- The two fonts are self-hosted; preloading the Latin files means text is drawn in them from the first paint -->
  <link rel="preload" href="../assets/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2B4C93">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin">

  <header class="site-header no-print">
    <div class="container admin-head">
      <a class="logo-link" href="/"><img src="../assets/stickers/logo-badge-new-96.webp" srcset="../assets/stickers/logo-badge-new-96.webp 96w, ../assets/stickers/logo-badge-new-192.webp 192w" sizes="56px" alt="" width="56" height="56"><span>AJ's Admin</span></a>
      <nav class="admin-nav" id="admin-nav" aria-label="Admin"></nav>
    </div>
  </header>

  <main class="container admin-main">
    <div class="toolbar no-print">
      <label class="toolbar-label" for="sunday">Sunday</label>
      <select id="sunday"></select>
      <button type="button" class="btn btn-small btn-ghost" id="packing-btn">Packing view</button>
      <button type="button" class="btn btn-small" id="add-order-btn">+ Add order</button>
    </div>

    <!-- Add an order yourself (Instagram, Messenger, walk-in). Filled by addFormHtml() -->
    <section class="t-card no-print" id="add-order" hidden></section>

    <!-- What needs you right now + the money for this Sunday. Filled by summaryHtml() -->
    <div class="o-summary no-print" id="summary" hidden></div>

    <!-- Find one order fast when a customer messages: name, @instagram, phone or order code -->
    <input type="search" id="search" class="admin-search no-print" placeholder="Find: name, @ig, phone or code"
      aria-label="Find an order" autocomplete="off" autocapitalize="none">

    <div class="chips no-print" id="chips" role="group" aria-label="Filter orders"></div>

    <div class="ops-ok ops-flash no-print" id="flash" role="status" hidden></div>

    <div class="form-error" id="message" role="alert" hidden></div>
    <div id="list"><p class="loading">Loading orders...</p></div>
  </main>

  <script type="module">
    import {
      requireAdmin, renderNav, setupSundayPicker, selectedSunday, expireStale, loadOrders, setStatus,
      formatWhen, timeLeft, singlesPack, rpc, select, loadFlavors, summarize,
    } from "../js/admin.js";
    import { esc, peso, formatSunday, addDays } from "../js/ui.js";

    await requireAdmin();
    renderNav("orders");

    const $ = (id) => document.getElementById(id);
    let orders = [];
    let flavors = [];                     // slug, name, weekly_cap: for the "left this Sunday" line
    let filter = "all";
    let search = "";                      // what's typed in the Find box
    let packing = false;
    let sunday = selectedSunday();
    const openRefs = new Set();           // which "Delivery & notes" sections are open, so a refresh doesn't close them

    const STATUS_LABEL = { pending: "Pending", paid: "Paid", cancelled: "Cancelled", expired: "Expired" };
    const SOURCE_LABEL = { instagram: "📸 Instagram", messenger: "💬 Messenger", walk_in: "🚶 Walk-in", other: "✍️ Manual" };
    const METHOD_LABEL = { gcash: "GCash", bank: "bank transfer", cash: "cash", other: "other" };

    // Order progress (only for PAID orders): new > baking > ready > out for delivery > completed
    const PREP_LABEL = { new: "To do", baking: "Baking", ready: "Ready", out_for_delivery: "Out for delivery", completed: "Done" };
    // The one button that moves the order forward
    function nextStep(o) {
      const delivery = o.fulfillment === "delivery";
      return {
        new:               { to: "baking", label: "Start baking" },
        baking:            { to: "ready", label: "Mark ready" },
        ready:             delivery ? { to: "out_for_delivery", label: "Out for delivery" } : { to: "completed", label: "Picked up" },
        out_for_delivery:  { to: "completed", label: "Delivered" },
      }[o.prep_status];
    }
    // One step back, for mis-taps
    function prevStep(o) {
      return { baking: "new", ready: "baking", out_for_delivery: "ready",
               completed: o.fulfillment === "delivery" ? "out_for_delivery" : "ready" }[o.prep_status];
    }

    // ONE list of stages. Every order is in exactly one. Listed (and sorted) by what needs you:
    // payments to check, then the kitchen steps, then orders still waiting on the customer, then finished.
    const STAGES = [
      ["all", "All"], ["check", "Check payment"], ["to_bake", "To bake"], ["baking", "Baking"],
      ["ready", "Ready"], ["unpaid", "Not paid yet"], ["done", "Done"], ["closed", "Cancelled / expired"],
    ];
    function stage(o) {
      const s = effectiveStatus(o);
      if (s === "cancelled" || s === "expired") return "closed";
      if (s === "pending") return o.gcash_ref ? "check" : "unpaid";
      return { new: "to_bake", baking: "baking", ready: "ready", out_for_delivery: "ready", completed: "done" }[o.prep_status];
    }
    const stageOrder = (o) => STAGES.findIndex(([k]) => k === stage(o));
    // Pill color by meaning: amber = needs you, blue = in the kitchen, green = done, grey = waiting, red = closed
    const STAGE_TONE = { check: "st-check", to_bake: "st-kitchen", baking: "st-kitchen", ready: "st-kitchen",
                         unpaid: "st-wait", done: "st-done", closed: "st-problem" };

    function flash(text) {
      $("flash").textContent = text; $("flash").hidden = false;
      clearTimeout(flash.t); flash.t = setTimeout(() => { $("flash").hidden = true; }, 2500);
    }

    function showMessage(text) {
      $("message").textContent = text || "";
      $("message").hidden = !text;
      if (text) $("message").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ---- Loading ------------------------------------------------------------------------
    async function load() {
      showMessage("");
      $("list").innerHTML = `<p class="loading">Loading orders...</p>`;
      try {
        // Mark overdue unpaid orders as expired first, so what you see is up to date
        try { await expireStale(); } catch (e) { console.error("expire failed", e); }
        [orders, flavors] = await Promise.all([loadOrders(sunday), flavors.length ? flavors : loadFlavors()]);
        render();
      } catch (err) {
        console.error(err);
        $("list").innerHTML = "";
        showMessage(err.isNetwork ? "Couldn't reach the server. Check your connection and refresh."
                                   : `Couldn't load orders: ${err.message}`);
      }
    }

    // ---- Drawing ------------------------------------------------------------------------
    function boxesHtml(o) {
      return o.boxes.map((b) => `
        <div class="o-box">
          <strong>Box ${b.position}: box of ${b.size}</strong>
          <div>${b.items.map((i) => `${i.qty} × ${esc(i.name)}`).join("<br>")}</div>
          ${b.gift_note ? `<div class="o-note">🎁 ${esc(b.gift_note)}</div>` : ""}
        </div>`).join("");
    }

    // Loose single cookies (not in a box): "Single cookies (3): 2 × Chimp Chips ..."
    const singlesCount = (o) => (o.singles || []).reduce((n, s) => n + s.qty, 0);
    function singlesHtml(o, packing = false) {
      if (!(o.singles || []).length) return "";
      const n = singlesCount(o);
      return `
        <div class="o-box">
          <strong>${packing ? `Singles: ${esc(singlesPack(n))}` : `Single cookies (${n})`}</strong>
          <div>${o.singles.map((s) => `${s.qty} × ${esc(s.name)}${packing ? "" : ` <span class="o-small">(${peso(s.unit_price)} each)</span>`}`).join("<br>")}</div>
        </div>`;
    }

    // Overdue pending orders count as expired for colouring, even if the flip hasn't happened yet.
    // "overdue" comes from the database clock, so this phone's clock/timezone can't skew it.
    const effectiveStatus = (o) => (o.overdue ? "expired" : o.status);

    function orderCard(o) {
      const status = effectiveStatus(o);
      const st = stage(o);
      const cls = st === "check" ? "needs-check" : status === "expired" ? "is-expired" : `is-${status}`;
      const ig = o.ig_handle ? o.ig_handle.replace(/^@/, "") : "";
      const phoneDigits = (o.phone || "").replace(/[^\d+]/g, "");
      const next = status === "paid" ? nextStep(o) : null;

      // The ONE main thing to do with this order right now
      let main = "";
      if (st === "check") {
        main = `<div class="o-todo">Check your GCash for <strong>${peso(o.total)}</strong>, ref <strong>${esc(o.gcash_ref)}</strong>.</div>
          <button type="button" class="btn btn-block" data-act="paid">Payment received, mark paid</button>`;
      } else if (st === "unpaid") {
        main = `<div class="o-todo">${o.source !== "website" && o.payment_method
            ? `Pays ${peso(o.total)} by ${esc(METHOD_LABEL[o.payment_method])} on the day.`
            : `Waiting for the customer to pay ${peso(o.total)} (${esc(timeLeft(o.seconds_left))}). Got the money anyway?`}</div>
          <button type="button" class="btn btn-block btn-ghost" data-act="paid">Mark paid</button>`;
      } else if (next) {
        main = `<button type="button" class="btn btn-block" data-prep="${next.to}">${esc(next.label)}</button>`;
      } else if (st === "closed") {
        main = `<button type="button" class="btn btn-small btn-ghost" data-act="pending">Reopen</button>`;
      }

      return `
      <article class="order-card ${cls}${st === "done" ? " st-done" : ""}" data-ref="${esc(o.ref_code)}">
        <div class="o-top">
          <span class="o-ref">${esc(o.ref_code)}</span>
          <span class="badge ${STAGE_TONE[st]}">${esc(STAGES.find(([k]) => k === st)[1])}</span>
        </div>
        <p class="o-who"><strong>${esc(o.name)}</strong>
          ${ig ? ` · <a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>` : ""}
          ${o.phone ? ` · <a href="tel:${esc(phoneDigits)}">${esc(o.phone)}</a>` : ""}</p>
        ${o.source && o.source !== "website" ? `<p class="o-meta o-small">${esc(SOURCE_LABEL[o.source] || o.source)} order${o.payment_method ? ` · ${o.status === "paid" ? "paid by" : "paying by"} ${esc(METHOD_LABEL[o.payment_method])}` : ""}</p>` : ""}
        <p class="o-meta">${o.fulfillment === "delivery"
          ? `🚚 Delivery: ${esc(o.address || "(no address)")}` : "🏠 Pickup"}</p>
        ${boxesHtml(o)}
        ${singlesHtml(o)}
        <p class="o-meta"><strong>${peso(o.total)}</strong>${o.gcash_ref ? ` · GCash ref <strong>${esc(o.gcash_ref)}</strong>` : ""}
          <span class="o-small"> · ordered ${esc(formatWhen(o.created_at))}</span></p>
        ${deliverySummary(o)}
        <div class="o-main no-print">${main}</div>
        ${st === "closed" ? "" : detailsHtml(o)}
      </article>`;
    }

    // "🚚 Lalamove · 3-4pm · LLM-123" and the internal note, if any were saved
    function deliverySummary(o) {
      const bits = [o.courier, o.delivery_slot, o.delivery_ref].filter(Boolean);
      return (bits.length ? `<p class="o-meta">🚚 ${bits.map(esc).join(" · ")}</p>` : "")
           + (o.admin_note ? `<p class="o-meta o-small">📝 ${esc(o.admin_note)}</p>` : "");
    }

    // Courier / booking ref / time slot (delivery only) and an internal note
    function detailsHtml(o) {
      const delivery = o.fulfillment === "delivery";
      const v = (x) => esc(x || "");
      return `<details class="o-more no-print" data-ref-d="${esc(o.ref_code)}"${openRefs.has(o.ref_code) ? " open" : ""}>
        <summary>${delivery ? "Delivery, notes, more" : "Notes, more"}</summary>
        <form class="ops-form" data-save-delivery>
          ${delivery ? `
          <div class="ops-field"><label>Courier</label><input name="courier" maxlength="60" placeholder="Lalamove, Grab..." value="${v(o.courier)}"></div>
          <div class="ops-field"><label>Time slot</label><input name="slot" maxlength="60" placeholder="3-4pm" value="${v(o.delivery_slot)}"></div>
          <div class="ops-field wide"><label>Booking number or tracking link</label><input name="ref" maxlength="300" value="${v(o.delivery_ref)}"></div>` : `
          <input type="hidden" name="courier" value="${v(o.courier)}"><input type="hidden" name="slot" value="${v(o.delivery_slot)}"><input type="hidden" name="ref" value="${v(o.delivery_ref)}">`}
          <div class="ops-field wide"><label>Note for yourself (customers never see this)</label><input name="note" maxlength="500" value="${v(o.admin_note)}"></div>
          <div class="wide"><button type="submit" class="btn btn-small">Save</button></div>
        </form>
        <div class="o-actions">
          ${o.status === "paid" && prevStep(o) ? `<button type="button" class="btn btn-small btn-ghost" data-prep="${prevStep(o)}">Undo last step</button>` : ""}
          <button type="button" class="btn btn-small btn-ghost btn-danger-ghost" data-act="cancelled">Cancel order</button>
        </div>
      </details>`;
    }

    // One card per paid order: what to put in the box, who it's for, the note
    function packingCard(o) {
      return `
      <article class="pack-card">
        <div class="o-top"><span class="o-ref">${esc(o.ref_code)}</span>
          <span>${o.fulfillment === "delivery" ? "🚚 DELIVERY" : "🏠 PICKUP"}</span></div>
        <p class="o-who"><strong>${esc(o.name)}</strong>${o.ig_handle ? ` · ${esc(o.ig_handle)}` : ""}${o.phone ? ` · ${esc(o.phone)}` : ""}</p>
        ${o.fulfillment === "delivery" ? `<p class="o-meta">${esc(o.address || "")}</p>` : ""}
        ${deliverySummary(o)}
        ${boxesHtml(o)}
        ${singlesHtml(o, true)}
      </article>`;
    }

    function render() {
      const counts = Object.fromEntries(STAGES.map(([k]) => [k, 0]));
      orders.forEach((o) => { counts[stage(o)] += 1; });
      counts.all = orders.length;
      // Only show stages that have orders (plus All), so the row stays short
      $("chips").innerHTML = orders.length ? STAGES.filter(([k]) => k === "all" || counts[k] || filter === k).map(([k, label]) =>
        `<button type="button" class="chip" data-filter="${k}" aria-pressed="${filter === k}">${esc(label)} (${counts[k]})</button>`
      ).join("") : "";

      $("summary").innerHTML = orders.length ? summaryHtml(counts) : "";
      $("summary").hidden = !orders.length || packing;

      $("packing-btn").textContent = packing ? "Back to orders" : "Packing view";
      $("search").hidden = packing || !orders.length;

      if (packing) {
        const paid = orders.filter((o) => o.status === "paid");
        $("list").innerHTML = `
          <div class="pack-head">
            <h1>Packing list: ${esc(formatSunday(sunday))}</h1>
            <p>${paid.length} paid order${paid.length === 1 ? "" : "s"}</p>
            <button type="button" class="btn btn-small no-print" id="print-btn">Print</button>
          </div>
          ${paid.length ? paid.map(packingCard).join("") : `<p class="loading">No paid orders for this Sunday yet.</p>`}`;
        const p = $("print-btn"); if (p) p.addEventListener("click", () => window.print());
        return;
      }

      // Typing in Find searches every stage (the chips are ignored while you search)
      $("chips").hidden = !!search;
      const shown = orders.filter((o) => search ? matches(o, search) : filter === "all" || stage(o) === filter)
        .sort((a, b) => stageOrder(a) - stageOrder(b));   // things that need you first, closed last
      $("list").innerHTML = shown.length
        ? shown.map(orderCard).join("")
        : `<p class="loading">${search ? `No order on ${esc(formatSunday(sunday))} matches "${esc(search)}". Wrong Sunday?`
            : orders.length ? "No orders at this stage." : "No orders for this Sunday yet."}</p><div id="next-hint"></div>`;
      if (!orders.length) findNextOrders();
    }

    // Top of the page: the ONE next thing to do, the rest in a line, and the money so far.
    function summaryHtml(c) {
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const todo = [
        c.check && plural(c.check, "payment to check", "payments to check"),
        c.to_bake && plural(c.to_bake, "order to bake", "orders to bake"),
        c.baking && `${c.baking} baking`,
        c.ready && plural(c.ready, "order ready to hand over", "orders ready to hand over"),
      ].filter(Boolean);
      const live = orders.filter((o) => !["closed"].includes(stage(o)));
      const paid = live.filter((o) => o.status === "paid").reduce((t, o) => t + Number(o.total), 0);
      const waiting = live.filter((o) => o.status === "pending").reduce((t, o) => t + Number(o.total), 0);
      return `<p class="o-next">${todo.length ? `Next: ${esc(todo[0])}` : c.unpaid ? "Nothing to do yet: waiting on payments" : "All caught up"}</p>
        ${todo.length > 1 ? `<p class="o-small">Then: ${esc(todo.slice(1).join(" · "))}</p>` : ""}
        <p class="o-small">${peso(paid)} paid${waiting ? ` · ${peso(waiting)} not paid yet (${c.unpaid + c.check})` : ""}</p>
        ${leftLine()}`;
    }

    // How many of each flavor can still be sold for this Sunday, so you can answer a DM without
    // opening another page. Same count as the website: paid + unpaid-not-expired orders hold cookies.
    function leftFor(list) {
      const per = summarize(list, flavors).perFlavor;
      return flavors.map((f) => ({ slug: f.slug, name: f.name, left: (f.weekly_cap ?? 0) - per[f.slug].paid - per[f.slug].pending }));
    }
    function leftLine() {
      if (!flavors.length) return "";
      return `<p class="o-left"><strong>Left to sell:</strong> ${leftFor(orders).map((f) =>
        `<span class="${f.left <= 0 ? "o-left-out" : f.left <= 3 ? "o-left-low" : ""}">${esc(f.name)} ${f.left <= 0 ? (f.left < 0 ? `${-f.left} over` : "sold out") : f.left}</span>`
      ).join(" · ")}</p>`;
    }

    // Find box: name, @instagram, phone (digits only, so "0917 123" finds "+63917123...") or order code
    function matches(o, q) {
      const text = q.toLowerCase().replace(/^@/, "");
      const digits = q.replace(/\D/g, "");
      if ([o.name, o.ig_handle, o.ref_code].some((v) => (v || "").toLowerCase().replace(/^@/, "").includes(text))) return true;
      if (digits.length >= 3) {
        const phone = (o.phone || "").replace(/\D/g, "");
        return phone.includes(digits) || phone.includes(digits.replace(/^0/, ""));   // 0917... vs +63917...
      }
      return false;
    }

    // Empty Sunday? Look ahead a few weeks and offer a jump to the next one that has orders
    async function findNextOrders() {
      const from = sunday;
      for (let w = 1; w <= 6; w++) {
        const d = addDays(from, w * 7);
        let list = [];
        try { list = await loadOrders(d); } catch { return; }
        if (sunday !== from) return;                    // you switched Sundays meanwhile
        if (list.length) {
          const el = $("next-hint"); if (!el) return;
          el.innerHTML = `<p class="t-sub" style="text-align:center">Next orders are for <strong>${esc(formatSunday(d))}</strong> (${list.length}).</p>
            <p style="text-align:center"><button type="button" class="btn btn-small" data-jump="${d}">Show ${esc(formatSunday(d))}</button></p>`;
          return;
        }
      }
    }

    // ---- Add an order yourself -------------------------------------------------------------
    // For orders that come in by Instagram, Messenger or in person. The database prices it and
    // checks the 15-per-flavor cap exactly like a website order (admin_create_order).
    let menu = null;                         // { flavors, boxes } loaded the first time the form opens
    let draftBoxes = [];                     // [{ size, qty: {slug: n} }]

    async function openAddForm() {
      const el = $("add-order");
      if (!menu) {
        el.hidden = false; el.innerHTML = `<p class="loading">Loading the menu...</p>`;
        try {
          const [flavors, boxes] = await Promise.all([
            select("flavors", "slug, name, single_price, surcharge, active", (q) => q.eq("active", true).order("id")),
            select("boxes", "size, price, active", (q) => q.eq("active", true).order("size")),
          ]);
          menu = { flavors, boxes };
        } catch (err) { el.innerHTML = ""; el.hidden = true; return showMessage(err.message); }
      }
      draftBoxes = [];
      el.innerHTML = addFormHtml(); el.hidden = false;
      syncAddForm(); updateDraft();
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.querySelector("[name=name]").focus({ preventScroll: true });
    }

    // A number box with − and + buttons either side (easier than typing on a phone)
    function qtyStepper(attrs, value, max, label) {
      return `<span class="stepper ao-stepper">
        <button type="button" data-step="-1" aria-label="One less ${esc(label)}">−</button>
        <input type="number" min="0" max="${max}" step="1" inputmode="numeric" value="${value}" ${attrs} aria-label="${esc(label)}">
        <button type="button" data-step="1" aria-label="One more ${esc(label)}">+</button></span>`;
    }

    const boxCount = (b) => Object.values(b.qty).reduce((a, x) => a + x, 0);
    function boxBlock(b, i) {
      const n = boxCount(b);
      return `<div class="ao-box" data-box="${i}">
        <div class="ops-head"><strong>Box ${i + 1}</strong>
          <select data-box-size aria-label="Box size">${menu.boxes.map((x) => `<option value="${x.size}"${x.size === b.size ? " selected" : ""}>Box of ${x.size} (${peso(x.price)})</option>`).join("")}</select>
          <button type="button" class="link-btn" data-box-remove>Remove</button></div>
        ${menu.flavors.map((f) => `<div class="ao-qty"><span>${esc(f.name)}${Number(f.surcharge) ? ` <span class="o-small">+${peso(Number(f.surcharge))} each</span>` : ""}</span>
          ${qtyStepper(`data-box-qty="${esc(f.slug)}"`, b.qty[f.slug] || 0, b.size, `${f.name} in box ${i + 1}`)}</div>`).join("")}
        <p class="o-small ${n === b.size ? "" : "ao-warn"}" data-box-count>${n} of ${b.size} picked${n === b.size ? " ✓" : ""}</p>
      </div>`;
    }

    // Price shown while you fill the form. Display only: the database works out the real total when you save.
    function draftTotal(form) {
      const bySlug = Object.fromEntries(menu.flavors.map((f) => [f.slug, f]));
      let total = 0, cookies = 0;
      form.querySelectorAll("[data-single]").forEach((i) => {
        const q = Math.max(0, Math.floor(Number(i.value) || 0));
        total += q * Number(bySlug[i.dataset.single].single_price); cookies += q;
      });
      for (const b of draftBoxes) {
        total += Number(menu.boxes.find((x) => x.size === b.size)?.price || 0);
        for (const [slug, q] of Object.entries(b.qty)) { total += q * Number(bySlug[slug]?.surcharge || 0); cookies += q; }
      }
      return { total, cookies };
    }

    // Cookies of each flavor in the form right now (singles + every box)
    function draftCookies(form) {
      const per = {};
      form.querySelectorAll("[data-single]").forEach((i) => { per[i.dataset.single] = (per[i.dataset.single] || 0) + Math.max(0, Math.floor(Number(i.value) || 0)); });
      for (const b of draftBoxes) for (const [slug, q] of Object.entries(b.qty)) per[slug] = (per[slug] || 0) + q;
      return per;
    }

    // Orders for the Sunday picked IN THE FORM (it can differ from the page's Sunday), for the "left after this order" line
    const ordersBySunday = {};
    async function ordersFor(d) {
      if (d === sunday) return orders;
      if (!ordersBySunday[d]) ordersBySunday[d] = await loadOrders(d);
      return ordersBySunday[d];
    }

    // Bottom of the form: the running total, and what would be left of each flavor after this order
    async function updateDraft() {
      const form = $("ao-form"); if (!form) return;
      const { total, cookies } = draftTotal(form);
      const want = draftCookies(form);
      const d = form.sunday.value;
      form.querySelector("[data-ao-total]").innerHTML = cookies
        ? `<strong>${peso(total)}</strong> · ${cookies} cookie${cookies === 1 ? "" : "s"}`
        : `Nothing added yet`;
      let list;
      try { list = await ordersFor(d); } catch { return; }
      if ($("ao-form") !== form || form.sunday.value !== d) return;   // form closed or Sunday changed meanwhile
      form.querySelector("[data-ao-left]").innerHTML = "After this order: " + leftFor(list).map((f) => {
        const after = f.left - (want[f.slug] || 0);
        return `<span class="${after < 0 ? "o-left-out" : after <= 3 ? "o-left-low" : ""}">${esc(f.name)} ${after < 0 ? `${-after} over the cap` : `${after} left`}</span>`;
      }).join(" · ");
    }

    function addFormHtml() {
      const sel = $("sunday");
      return `<form class="ops-form" id="ao-form" novalidate>
        <div class="ops-head wide"><h2 style="margin:0">Add an order</h2><button type="button" class="link-btn" data-ao-close>Close</button></div>
        <p class="t-sub wide" style="margin:0">For orders from Instagram, Messenger or in person. Prices and the weekly cap work like the website.</p>
        <div class="ops-field"><label>For Sunday</label><select name="sunday">${[...sel.options].map((op) =>
          `<option value="${op.value}"${op.value === sunday ? " selected" : ""}>${esc(op.textContent)}</option>`).join("")}</select></div>
        <div class="ops-field"><label>Came from</label><select name="source">
          <option value="instagram">Instagram</option><option value="messenger">Messenger</option>
          <option value="walk_in">Walk-in</option><option value="other">Other</option></select></div>
        <div class="ops-field"><label>Name</label><input name="name" maxlength="100" required autocomplete="off"></div>
        <div class="ops-field"><label>Instagram (optional)</label><input name="ig" maxlength="60" autocapitalize="none" placeholder="@handle"></div>
        <div class="ops-field"><label>Mobile (optional)</label><input name="phone" type="tel" inputmode="tel" maxlength="20"></div>
        <div class="ops-field"><label>Pickup or delivery</label><select name="fulfillment">
          <option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div>
        <div class="ops-field wide" data-ao-address hidden><label>Delivery address</label><input name="address" maxlength="300"></div>

        <div class="wide"><h3 class="ao-h">Single cookies</h3>
          ${menu.flavors.filter((f) => f.single_price != null).map((f) => `<div class="ao-qty"><span>${esc(f.name)} <span class="o-small">${peso(Number(f.single_price))}</span></span>
            ${qtyStepper(`data-single="${esc(f.slug)}"`, 0, 99, `${f.name} singles`)}</div>`).join("")}
        </div>
        <div class="wide"><h3 class="ao-h">Boxes</h3>
          <div id="ao-boxes">${draftBoxes.map(boxBlock).join("")}</div>
          <button type="button" class="btn btn-small btn-ghost" data-box-add>+ Add a box</button>
        </div>

        <div class="ops-field wide"><label>Payment</label>
          <label class="choice"><input type="radio" name="payment" value="paid" checked> <span>Paid already</span></label>
          <label class="choice"><input type="radio" name="payment" value="pay_on_day"> <span>Pays on pickup / delivery (keeps the slot until Sunday)</span></label>
          <label class="choice"><input type="radio" name="payment" value="unpaid"> <span>Not paid yet (releases after 24 hours, like the website)</span></label>
        </div>
        <div class="ops-field" data-ao-method><label>Paid / paying by</label><select name="method">
          <option value="gcash">GCash</option><option value="bank">Bank transfer</option><option value="cash">Cash</option><option value="other">Other</option></select></div>
        <div class="ops-field" data-ao-ref><label>GCash ref (optional)</label><input name="gcash" inputmode="numeric" maxlength="15"></div>
        <div class="ops-field wide"><label>Note for yourself (optional)</label><input name="note" maxlength="500"></div>
        <div class="wide ao-total">
          <p class="ao-total-line">Total: <span data-ao-total></span></p>
          <p class="o-small" data-ao-left></p>
          <button type="submit" class="btn btn-block">Save order</button>
        </div>
      </form>`;
    }

    // Re-draw just the boxes part (keeps what's typed in the other fields)
    function redrawBoxes() { $("ao-boxes").innerHTML = draftBoxes.map(boxBlock).join(""); updateDraft(); }

    function syncAddForm() {
      const f = $("ao-form"); if (!f) return;
      f.querySelector("[data-ao-address]").hidden = f.fulfillment.value !== "delivery";
      const pay = f.querySelector('input[name="payment"]:checked').value;
      f.querySelector("[data-ao-method]").hidden = pay === "unpaid";
      f.querySelector("[data-ao-ref]").hidden = !(pay === "paid" && f.method.value === "gcash");
    }

    async function saveOrder(form, overCap = false) {
      const f = new FormData(form);
      const singles = [...form.querySelectorAll("[data-single]")].map((i) => ({ flavor_slug: i.dataset.single, qty: Math.floor(Number(i.value) || 0) })).filter((x) => x.qty > 0);
      const boxes = draftBoxes.map((b) => ({ size: b.size, items: Object.entries(b.qty).filter(([, q]) => q > 0).map(([flavor_slug, qty]) => ({ flavor_slug, qty })) }));
      const bad = draftBoxes.findIndex((b) => Object.values(b.qty).reduce((a, x) => a + x, 0) !== b.size);
      if (bad >= 0) return showMessage(`Box ${bad + 1} needs exactly ${draftBoxes[bad].size} cookies.`);
      if (!singles.length && !boxes.length) return showMessage("Add at least one cookie or box.");
      const pay = f.get("payment");
      const btn = form.querySelector("button[type=submit]"); btn.disabled = true; showMessage("");
      try {
        const res = await rpc("admin_create_order", {
          p_sunday: f.get("sunday"), p_name: f.get("name"), p_phone: f.get("phone"), p_ig_handle: f.get("ig"),
          p_source: f.get("source"), p_fulfillment: f.get("fulfillment"), p_address: f.get("address"),
          p_boxes: boxes, p_singles: singles, p_payment: pay,
          p_payment_method: pay === "unpaid" ? null : f.get("method"),
          p_gcash_ref: pay === "paid" && f.get("method") === "gcash" ? f.get("gcash") : null,
          p_note: f.get("note"), p_allow_over_cap: overCap,
        });
        const row = Array.isArray(res) ? res[0] : res;
        $("add-order").hidden = true; $("add-order").innerHTML = "";
        for (const d in ordersBySunday) delete ordersBySunday[d];   // counts changed: fetch fresh next time
        // Show the Sunday the order went to
        if (row.sunday_date !== sunday) { const sel = $("sunday"); sel.value = row.sunday_date; sunday = row.sunday_date; }
        orders = await loadOrders(sunday); render();
        flash(`Saved ${row.ref_code} · ${peso(row.total)}`);
      } catch (err) {
        console.error(err); btn.disabled = false;
        // Over the 15 cap: say so, and let her go ahead if she's baking extra
        if (err.hint === "flavor_cap" && confirm(`${err.message}\n\nAdd it anyway? Only do this if you'll bake extra.`)) return saveOrder(form, true);
        showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was saved." : err.message);
      }
    }

    $("add-order-btn").addEventListener("click", openAddForm);
    $("add-order").addEventListener("click", (e) => {
      if (e.target.closest("[data-ao-close]")) { $("add-order").hidden = true; $("add-order").innerHTML = ""; return; }
      if (e.target.closest("[data-box-add]")) { draftBoxes.push({ size: menu.boxes[0]?.size || 3, qty: {} }); redrawBoxes(); return; }
      const rm = e.target.closest("[data-box-remove]");
      if (rm) { draftBoxes.splice(Number(rm.closest("[data-box]").dataset.box), 1); redrawBoxes(); return; }
      // − / + next to a number: change it by one, then let the "input" handler below do the rest
      const step = e.target.closest("[data-step]");
      if (step) {
        const input = step.parentElement.querySelector("input");
        let v = Math.max(0, Math.floor(Number(input.value) || 0) + Number(step.dataset.step));
        const box = step.closest("[data-box]");
        if (box && Number(step.dataset.step) > 0) {               // a full box takes no more cookies
          const b = draftBoxes[Number(box.dataset.box)];
          if (boxCount(b) >= b.size) return;
        }
        input.value = Math.min(v, Number(input.max) || 99);
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });
    // Typing a number (or tapping − / +): keep the box count and the total up to date as you go
    $("add-order").addEventListener("input", (e) => {
      const box = e.target.closest("[data-box]");
      if (box && e.target.matches("[data-box-qty]")) {
        // Only update the "x of N picked" line, so the field you're typing in isn't replaced
        const b = draftBoxes[Number(box.dataset.box)];
        b.qty[e.target.dataset.boxQty] = Math.max(0, Math.floor(Number(e.target.value) || 0));
        const n = boxCount(b);
        const line = box.querySelector("[data-box-count]");
        line.textContent = `${n} of ${b.size} picked${n === b.size ? " ✓" : ""}`; line.classList.toggle("ao-warn", n !== b.size);
      }
      if (e.target.matches("[data-box-qty], [data-single]")) updateDraft();
    });
    $("add-order").addEventListener("change", (e) => {
      const box = e.target.closest("[data-box]");
      if (box) {
        if (e.target.matches("[data-box-size]")) { draftBoxes[Number(box.dataset.box)].size = Number(e.target.value); redrawBoxes(); }
        return;
      }
      if (e.target.name === "sunday") updateDraft();
      syncAddForm();
    });
    $("add-order").addEventListener("submit", (e) => { e.preventDefault(); saveOrder(e.target); });

    // ---- Events -------------------------------------------------------------------------
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest("[data-filter]"); if (!b) return;
      filter = b.dataset.filter; render();
    });

    $("search").addEventListener("input", (e) => { search = e.target.value.trim(); render(); });


    $("packing-btn").addEventListener("click", () => { packing = !packing; render(); });

    // Remember which "Delivery & notes" sections are open
    $("list").addEventListener("toggle", (e) => {
      const d = e.target.closest?.("[data-ref-d]"); if (!d) return;
      d.open ? openRefs.add(d.dataset.refD) : openRefs.delete(d.dataset.refD);
    }, true);

    // Save courier / slot / ref / note
    $("list").addEventListener("submit", async (e) => {
      const form = e.target.closest("[data-save-delivery]"); if (!form) return;
      e.preventDefault();
      const ref = form.closest("[data-ref]").dataset.ref;
      const f = new FormData(form);
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true; showMessage("");
      try {
        await rpc("admin_set_order_delivery", {
          p_ref_code: ref, p_courier: f.get("courier"), p_delivery_ref: f.get("ref"),
          p_delivery_slot: f.get("slot"), p_admin_note: f.get("note"),
        });
        orders = await loadOrders(sunday);
        render(); flash("Saved " + ref);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was saved." : err.message);
      }
    });

    // Mark paid / Cancel / Reopen (one listener for every card)
    $("list").addEventListener("click", async (e) => {
      const jump = e.target.closest("[data-jump]");
      if (jump) {                                               // "Show Sunday, Oct 25"
        const sel = $("sunday");
        if (![...sel.options].some((op) => op.value === jump.dataset.jump)) sel.add(new Option(formatSunday(jump.dataset.jump), jump.dataset.jump));
        sel.value = jump.dataset.jump; sel.dispatchEvent(new Event("change"));
        return;
      }
      const prepBtn = e.target.closest("[data-prep]");
      if (prepBtn) {                                           // Start baking / Mark ready / Out for delivery / ...
        const pref = prepBtn.closest("[data-ref]").dataset.ref;
        showMessage(""); prepBtn.disabled = true;
        try {
          await rpc("admin_set_order_prep", { p_ref_code: pref, p_prep: prepBtn.dataset.prep });
          orders = await loadOrders(sunday);
          render();
          flash(`${pref}: ${PREP_LABEL[prepBtn.dataset.prep]}`);     // the card may jump to another spot, so say what happened
        } catch (err) {
          console.error(err);
          prepBtn.disabled = false;
          showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was changed." : err.message);
        }
        return;
      }
      const btn = e.target.closest("[data-act]"); if (!btn) return;
      const ref = btn.closest("[data-ref]").dataset.ref;
      const act = btn.dataset.act;
      if (act === "cancelled" && !confirm(`Cancel order ${ref}? Its cookies go back to the Sunday.`)) return;

      showMessage("");
      btn.disabled = true;
      try {
        await setStatus(ref, act);
        orders = await loadOrders(sunday);
        render();
        flash(`${ref}: ${{ paid: "marked paid", cancelled: "cancelled", pending: "reopened" }[act] || STATUS_LABEL[act]}`);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        showMessage(err.isNetwork ? "Couldn't reach the server. Nothing was changed." : err.message);
      }
    });

    setupSundayPicker($("sunday"), (d) => { sunday = d; load(); });
    load();
  </script>
</body>
</html>
