<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Totals | AJ's Bakery admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#3a72b8">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin">

  <header class="site-header">
    <div class="container admin-head">
      <span class="logo-link"><span>AJ's Admin</span></span>
      <nav class="admin-nav" id="admin-nav" aria-label="Admin"></nav>
    </div>
  </header>

  <main class="container admin-main">
    <div class="toolbar">
      <label class="toolbar-label" for="sunday">Sunday</label>
      <select id="sunday"></select>
    </div>

    <div class="form-error" id="message" role="alert" hidden></div>
    <div id="out"><p class="loading">Loading totals...</p></div>
  </main>

  <script type="module">
    import {
      requireAdmin, renderNav, setupSundayPicker, selectedSunday, expireStale, loadOrders, loadFlavors,
      summarize, batchesFor, BATCH_SIZE,
    } from "../js/admin.js";
        import { esc } from "../js/ui.js";

    await requireAdmin();
    renderNav("totals");

    const $ = (id) => document.getElementById(id);
    let sunday = selectedSunday();
    let includePending = true;      // bake for unpaid-but-still-open orders too?
    let data = null;                // { summary, cap }

    async function load() {
      $("message").hidden = true;
      $("out").innerHTML = `<p class="loading">Loading totals...</p>`;
      try {
        try { await expireStale(); } catch (e) { console.error("expire failed", e); }
        // Each flavor's weekly cap comes from the database too (flavors.weekly_cap), so it's never out of sync
        const [orders, flavors] = await Promise.all([loadOrders(sunday), loadFlavors()]);
        data = { summary: summarize(orders, flavors) };
        render();
      } catch (err) {
        console.error(err);
        $("out").innerHTML = "";
        $("message").textContent = err.isNetwork ? "Couldn't reach the server. Check your connection and refresh."
                                                  : `Couldn't load totals: ${err.message}`;
        $("message").hidden = false;
      }
    }

    function render() {
      const { summary } = data;
      const used = summary.paid + summary.pending;       // all reserved cookies, every flavor
      const flavors = Object.values(summary.perFlavor);
      const sizes = Object.keys(summary.boxes).map(Number).sort((a, b) => a - b);

      // Batches: bake for paid, plus pending if the box is ticked
      let totalBatches = 0;
      const batchRows = flavors.map((f) => {
        const need = f.paid + (includePending ? f.pending : 0);
        const { batches, leftover } = batchesFor(need);
        totalBatches += batches;
        return `<tr><th scope="row">${esc(f.name)}</th><td>${need}</td><td><strong>${batches}</strong></td><td>${leftover}</td></tr>`;
      }).join("");

      $("out").innerHTML = `
        <section class="t-card">
          <h2>Reserved vs weekly cap</h2>
          <p class="t-sub">Each flavor has its own cap per Sunday. Paid and pending orders reserve cookies; cancelled and expired ones don't.</p>
          ${flavors.map((f) => {
            const reserved = f.paid + f.pending;
            const pct = f.cap ? Math.min(100, Math.round((reserved / f.cap) * 100)) : 100;
            const left = Math.max((f.cap ?? 0) - reserved, 0);
            return `<div class="cap-row">
              <div class="cap-head"><strong>${esc(f.name)}</strong>
                <span>${reserved} of ${f.cap ?? "?"} <span class="t-sub">(${left === 0 ? "sold out" : left + " left"})</span></span></div>
              <div class="progress${reserved >= f.cap ? " progress-full" : ""}" aria-hidden="true"><div style="width:${pct}%"></div></div>
            </div>`;
          }).join("")}
        </section>

        <section class="t-card">
          <h2>Cookies per flavor</h2>
          <p class="t-sub">Counts box cookies and single cookies together.</p>
          <table class="t-table">
            <thead><tr><th></th><th>Paid</th><th>Pending</th><th>Total</th><th>Cap</th></tr></thead>
            <tbody>
              ${flavors.map((f) => `<tr><th scope="row">${esc(f.name)}</th><td>${f.paid}</td><td>${f.pending}</td><td><strong>${f.paid + f.pending}</strong></td><td>${f.cap ?? "?"}</td></tr>`).join("")}
              <tr class="t-sum"><th scope="row">All flavors</th><td>${summary.paid}</td><td>${summary.pending}</td><td><strong>${used}</strong></td><td></td></tr>
            </tbody>
          </table>
        </section>

        <section class="t-card">
          <h2>Boxes and singles</h2>
          ${sizes.length || summary.singles.paid + summary.singles.pending ? `
          <table class="t-table">
            <thead><tr><th></th><th>Paid</th><th>Pending</th><th>Total</th></tr></thead>
            <tbody>
              ${sizes.map((s) => `<tr><th scope="row">Box of ${s}</th><td>${summary.boxes[s].paid}</td><td>${summary.boxes[s].pending}</td><td><strong>${summary.boxes[s].paid + summary.boxes[s].pending}</strong></td></tr>`).join("")}
              <tr><th scope="row">Single cookies</th><td>${summary.singles.paid}</td><td>${summary.singles.pending}</td><td><strong>${summary.singles.paid + summary.singles.pending}</strong></td></tr>
            </tbody>
          </table>
          <p class="t-sub">Boxes are counted as boxes; single cookies are counted as cookies.</p>` : `<p class="t-sub">No boxes or singles yet.</p>`}
        </section>

        <section class="t-card">
          <h2>Batches to bake</h2>
          <label class="choice t-toggle"><input type="checkbox" id="inc-pending" ${includePending ? "checked" : ""}>
            <span>Include pending (unpaid) orders</span></label>
          <table class="t-table">
            <thead><tr><th></th><th>Cookies</th><th>Batches</th><th>Left over</th></tr></thead>
            <tbody>${batchRows}
              <tr class="t-sum"><th scope="row">Total batches</th><td></td><td><strong>${totalBatches}</strong></td><td></td></tr>
            </tbody>
          </table>
          <p class="t-sub">One batch = ${BATCH_SIZE} cookies. Leftover = spare cookies from the last batch of each flavor.</p>
        </section>`;

      $("inc-pending").addEventListener("change", (e) => { includePending = e.target.checked; render(); });
    }

    setupSundayPicker($("sunday"), (d) => { sunday = d; load(); });
    load();
  </script>
</body>
</html>
