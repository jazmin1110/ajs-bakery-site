<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sales | AJ's Bakery admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64.png?v=3">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="../site.webmanifest?v=3">
  <!-- The two fonts are self-hosted; preloading the Latin files means text is drawn in them from the first paint -->
  <link rel="preload" href="../assets/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2B4C93">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin">

  <header class="site-header">
    <div class="container admin-head">
      <a class="logo-link" href="/"><img src="../assets/stickers/logo-badge-new-96.webp" srcset="../assets/stickers/logo-badge-new-96.webp 96w, ../assets/stickers/logo-badge-new-192.webp 192w" sizes="56px" alt="" width="56" height="56"><span>AJ's Admin</span></a>
      <nav class="admin-nav" id="admin-nav" aria-label="Admin"></nav>
    </div>
  </header>

  <main class="container admin-main">
    <!-- MONEY: what came in, what the cookies cost, what was wasted = profit, per Sunday -->
    <section class="t-card" id="money">
      <div class="ops-head"><h1 style="margin:0;font-size:1.5rem">Money</h1></div>
      <div class="chips" id="money-range" role="group" aria-label="Period"></div>
      <div id="money-out"><p class="loading">Loading money...</p></div>
    </section>

    <!-- BEST SELLERS: across many Sundays. The per-Sunday totals are further down. -->
    <section class="t-card" id="best">
      <div class="ops-head"><h2 style="margin:0;font-size:1.5rem">Best sellers</h2></div>
      <div class="chips" id="best-range" role="group" aria-label="Period"></div>
      <div id="best-out"><p class="loading">Loading sales...</p></div>
    </section>

    <h2 style="margin:1.4rem 0 .6rem">One Sunday</h2>
    <div class="toolbar">
      <label class="toolbar-label" for="sunday">Sunday</label>
      <select id="sunday"></select>
    </div>

    <div class="form-error" id="message" role="alert" hidden></div>
    <div id="out"><p class="loading">Loading totals...</p></div>
  </main>

  <script type="module">
    import {
      requireAdmin, renderNav, setupSundayPicker, selectedSunday, expireStale, loadOrders, loadFlavors,
      summarize, batchesFor, BATCH_SIZE, rpc, currentSunday, peso2, shortDate, num,
    } from "../js/admin.js";
    import { esc, addDays } from "../js/ui.js";

    await requireAdmin();
    renderNav("totals");

    const $ = (id) => document.getElementById(id);
    let sunday = selectedSunday();
    let includePending = true;      // bake for unpaid-but-still-open orders too?
    let data = null;                // { summary, cap }

    // ---- Best sellers ------------------------------------------------------------------
    // Paid orders only. "Sold out" weeks matter: if a flavor hits its cap every week,
    // people wanted more than you baked, so its real demand is hidden by the cap.
    const RANGES = [["4", "Last 4 Sundays"], ["12", "Last 12 Sundays"], ["all", "All time"]];
    let range = "4";

    async function loadBest() {
      $("best-range").innerHTML = RANGES.map(([k, label]) =>
        `<button type="button" class="chip" data-range="${k}" aria-pressed="${range === k}">${label}</button>`).join("");
      const now = currentSunday();
      const from = range === "all" ? "2020-01-05" : addDays(now, -7 * (Number(range) - 1));
      const to = addDays(now, 7 * 8);                       // paid orders already in for the next few weeks count too
      try {
        renderBest(await rpc("admin_sales_report", { p_from: from, p_to: to }));
      } catch (err) {
        console.error(err);
        $("best-out").innerHTML = `<p class="form-error">Couldn't load sales: ${esc(err.message)}</p>`;
      }
    }

    function renderBest(rep) {
      const fl = rep.flavors;
      const total = rep.total_cookies;
      if (!total) {
        $("best-out").innerHTML = `<p class="t-sub">No paid orders in this period yet. Once orders are marked paid, the ranking shows up here.</p>`;
        return;
      }
      const top = fl[0], max = Math.max(...fl.map((f) => f.cookies), 1);
      const weeks = rep.weeks_with_sales;
      const always = fl.filter((f) => f.cookies && f.sold_out_weeks === f.weeks.length);
      const notes = [];
      if (weeks < 4) notes.push(`Only ${weeks} Sunday${weeks === 1 ? "" : "s"} of sales so far. Give it about 4 before you drop or change a flavor.`);
      if (always.length) notes.push(`${always.map((f) => `<strong>${esc(f.name)}</strong>`).join(" and ")} sold out every Sunday ${always.length === 1 ? "it was" : "they were"} on sale, so the 15 cap is hiding real demand. Try baking more of ${always.length === 1 ? "it" : "them"}.`);

      $("best-out").innerHTML = `
        <p class="bs-lead"><strong>${esc(top.name)}</strong> is your best seller:
          ${num(top.cookies)} of ${num(total)} cookies (${Math.round((top.cookies / total) * 100)}%) across ${weeks} Sunday${weeks === 1 ? "" : "s"} and ${num(rep.total_orders)} paid order${rep.total_orders === 1 ? "" : "s"}.</p>
        <ol class="bs-list">
          ${fl.map((f) => {
            const pct = Math.round((f.cookies / total) * 100);
            return `<li>
              <div class="bs-row"><span class="bs-name">${esc(f.name)}</span><span class="bs-val">${num(f.cookies)} <span class="o-small">(${pct}%)</span></span></div>
              <div class="bs-bar" role="img" aria-label="${esc(f.name)}: ${f.cookies} cookies, ${pct}%"><span style="width:${(f.cookies / max) * 100}%"></span></div>
              <p class="o-small">${peso2(f.revenue)} · in ${f.orders} order${f.orders === 1 ? "" : "s"} · ${f.in_boxes} picked in boxes, ${f.as_singles} as singles
                · sold out ${f.sold_out_weeks} of ${f.weeks.length} Sunday${f.weeks.length === 1 ? "" : "s"}</p>
            </li>`;
          }).join("")}
        </ol>
        ${notes.map((n) => `<div class="ops-note">${n}</div>`).join("")}
        <details class="o-more"><summary>Week by week</summary>
          <div class="ops-scroll"><table class="t-table">
            <thead><tr><th class="left">Sunday</th>${fl.map((f) => `<th>${esc(f.name)}</th>`).join("")}</tr></thead>
            <tbody>${rep.sundays.map((d) => `<tr><th scope="row" class="left">${esc(shortDate(d))}</th>${fl.map((f) => {
              const w = f.weeks.find((x) => x.sunday === d); const n = w ? w.cookies : 0;
              return `<td>${n}${n >= f.cap ? " ✓" : ""}</td>`; }).join("")}</tr>`).join("")}</tbody>
          </table></div>
          <p class="o-small">✓ = sold out that Sunday. Money is an estimate: box cookies get an even share of the box price, plus their surcharge.</p>
        </details>`;
    }

    $("best-range").addEventListener("click", (e) => {
      const b = e.target.closest("[data-range]"); if (!b) return;
      range = b.dataset.range; $("best-out").innerHTML = `<p class="loading">Loading sales...</p>`; loadBest();
    });
    loadBest();

    // ---- Money -------------------------------------------------------------------------
    // From admin_money_report. Money in = what paid orders paid. Cost = the cookies BAKED that
    // week, at the prices you actually paid for the exact stock used (not today's price).
    // Waste = stock + dough thrown away. Recount = stock that went missing (or turned up).
    let moneyRange = "4";
    const signed = (n) => `<span class="${n < 0 ? "money-neg" : ""}">${n < 0 ? "−" : ""}${peso2(Math.abs(Math.round(n * 100) / 100))}</span>`;

    async function loadMoney() {
      $("money-range").innerHTML = RANGES.map(([k, label]) =>
        `<button type="button" class="chip" data-range="${k}" aria-pressed="${moneyRange === k}">${label}</button>`).join("");
      const now = currentSunday();
      const from = moneyRange === "all" ? "2026-01-04" : addDays(now, -7 * (Number(moneyRange) - 1));
      try {
        renderMoney(await rpc("admin_money_report", { p_from: from, p_to: addDays(now, 7 * 8) }));   // paid orders for the next few weeks count too
      } catch (err) {
        console.error(err);
        $("money-out").innerHTML = `<p class="form-error">Couldn't load money: ${esc(err.message)}</p>`;
      }
    }

    // The breakdown lines, used for the whole period and for one Sunday
    function moneyLines(t) {
      const margin = t.money_in > 0 ? Math.round((t.profit / t.money_in) * 100) : null;
      return `
        <div class="money-row"><span>Money in (paid orders)</span><strong>${peso2(t.money_in)}</strong></div>
        <div class="money-row"><span>Cookies baked: ingredients + packaging${t.cookies_baked ? ` <span class="o-small">(${num(t.cookies_baked)} cookies)</span>` : ""}</span>${signed(-t.cookie_cost)}</div>
        <div class="money-row"><span>Thrown away (stock + dough)</span>${signed(-t.waste)}</div>
        ${Number(t.recount) ? `<div class="money-row"><span>Recount difference <span class="o-small">(${t.recount < 0 ? "missing" : "found"})</span></span>${signed(t.recount)}</div>` : ""}
        <div class="money-row total"><span>Profit${margin !== null ? ` <span class="o-small">(${margin}% of money in)</span>` : ""}</span><strong class="${t.profit < 0 ? "money-neg" : "money-pos"}">${t.profit < 0 ? "−" : ""}${peso2(Math.abs(Math.round(t.profit * 100) / 100))}</strong></div>`;
    }

    function renderMoney(rep) {
      const t = rep.totals;
      const weeks = rep.weeks.filter((w) => w.money_in || w.cookie_cost || w.waste || w.recount || w.spent);
      const notes = [];
      if (!weeks.length) {
        $("money-out").innerHTML = `<p class="t-sub">Nothing yet. Money in shows up when orders are marked paid; costs show up when you tap "I baked these" on the Bake plan.</p>`;
        return;
      }
      if (t.money_in > 0 && !t.cookie_cost) notes.push(`No cookie costs yet. Costs are counted when you tap <strong>"I baked these"</strong> on the Bake plan, so log your bakes there.`);
      if (t.estimated) notes.push("Some of the cost is estimated: dough made before costs were tracked, or baked with stock that wasn't logged, is priced at today's prices.");
      if (rep.guessed_prices) notes.push(`${rep.guessed_prices} item${rep.guessed_prices === 1 ? " still has a" : "s still have a"} guessed price. Log a purchase with what you paid on the <a href="inventory.html">Stock page</a> to make this exact.`);
      $("money-out").innerHTML = `
        ${moneyLines(t)}
        <p class="o-small" style="margin-top:.5rem">Spent on stock in this period: <strong>${peso2(t.spent)}</strong>. That's cash out, not cost: anything not baked yet is still on the shelf.
          Labor, gas/electricity and delivery aren't included.</p>
        ${notes.map((n) => `<div class="ops-note">${n}</div>`).join("")}
        <details class="o-more"><summary>Week by week</summary>
          <div class="ops-scroll"><table class="t-table">
            <thead><tr><th class="left">Sunday</th><th>In</th><th>Cost</th><th>Waste</th><th>Profit</th></tr></thead>
            <tbody>${weeks.map((w) => `<tr><th scope="row" class="left">${esc(shortDate(w.sunday))}${w.estimated ? " *" : ""}</th>
              <td>${peso2(w.money_in)}</td><td>${peso2(w.cookie_cost)}</td><td>${peso2(w.waste)}</td><td><strong>${signed(w.profit)}</strong></td></tr>`).join("")}</tbody>
          </table></div>
          ${weeks.some((w) => w.estimated) ? `<p class="o-small">* part of that week's cost is estimated.</p>` : ""}
        </details>`;
    }

    $("money-range").addEventListener("click", (e) => {
      const b = e.target.closest("[data-range]"); if (!b) return;
      moneyRange = b.dataset.range; $("money-out").innerHTML = `<p class="loading">Loading money...</p>`; loadMoney();
    });
    loadMoney();

    async function load() {
      $("message").hidden = true;
      $("out").innerHTML = `<p class="loading">Loading totals...</p>`;
      try {
        try { await expireStale(); } catch (e) { console.error("expire failed", e); }
        // Each flavor's weekly cap comes from the database too (flavors.weekly_cap), so it's never out of sync
        const [orders, flavors, money] = await Promise.all([loadOrders(sunday), loadFlavors(),
          rpc("admin_money_report", { p_from: sunday, p_to: sunday })]);
        data = { summary: summarize(orders, flavors), money: money.weeks[0] || null };
        render();
      } catch (err) {
        console.error(err);
        $("out").innerHTML = "";
        $("message").textContent = err.isNetwork ? "Couldn't reach the server. Check your connection and refresh."
                                                  : `Couldn't load totals: ${err.message}`;
        $("message").hidden = false;
      }
    }

    function render() {
      const { summary } = data;
      const used = summary.paid + summary.pending;       // all reserved cookies, every flavor
      const flavors = Object.values(summary.perFlavor);
      const sizes = Object.keys(summary.boxes).map(Number).sort((a, b) => a - b);

      // Batches: bake for paid, plus pending if the box is ticked
      let totalBatches = 0;
      const batchRows = flavors.map((f) => {
        const need = f.paid + (includePending ? f.pending : 0);
        const { batches, leftover } = batchesFor(need);
        totalBatches += batches;
        return `<tr><th scope="row">${esc(f.name)}</th><td>${need}</td><td><strong>${batches}</strong></td><td>${leftover}</td></tr>`;
      }).join("");

      const m = data.money;
      $("out").innerHTML = `
        ${m ? `<section class="t-card"><h2>Money for this Sunday</h2>${moneyLines(m)}
          ${m.dough_balls_thrown ? `<p class="o-small">${m.dough_balls_thrown} dough ball${m.dough_balls_thrown === 1 ? "" : "s"} thrown away.</p>` : ""}
          ${m.cookies_baked > m.cookies_sold && m.cookies_sold ? `<p class="o-small">You baked ${m.cookies_baked - m.cookies_sold} more cookie${m.cookies_baked - m.cookies_sold === 1 ? "" : "s"} than you sold (paid). Extras count as cost.</p>` : ""}</section>` : ""}
        <section class="t-card">
          <h2>Reserved vs weekly cap</h2>
          <p class="t-sub">Each flavor has its own cap per Sunday. Paid and pending orders reserve cookies; cancelled and expired ones don't.</p>
          ${flavors.map((f) => {
            const reserved = f.paid + f.pending;
            const pct = f.cap ? Math.min(100, Math.round((reserved / f.cap) * 100)) : 100;
            const left = Math.max((f.cap ?? 0) - reserved, 0);
            return `<div class="cap-row">
              <div class="cap-head"><strong>${esc(f.name)}</strong>
                <span>${reserved} of ${f.cap ?? "?"} <span class="t-sub">(${left === 0 ? "sold out" : left + " left"})</span></span></div>
              <div class="progress${reserved >= f.cap ? " progress-full" : ""}" aria-hidden="true"><div style="width:${pct}%"></div></div>
            </div>`;
          }).join("")}
        </section>

        <section class="t-card">
          <h2>Cookies per flavor</h2>
          <p class="t-sub">Counts box cookies and single cookies together.</p>
          <table class="t-table">
            <thead><tr><th></th><th>Paid</th><th>Pending</th><th>Total</th><th>Cap</th></tr></thead>
            <tbody>
              ${flavors.map((f) => `<tr><th scope="row">${esc(f.name)}</th><td>${f.paid}</td><td>${f.pending}</td><td><strong>${f.paid + f.pending}</strong></td><td>${f.cap ?? "?"}</td></tr>`).join("")}
              <tr class="t-sum"><th scope="row">All flavors</th><td>${summary.paid}</td><td>${summary.pending}</td><td><strong>${used}</strong></td><td></td></tr>
            </tbody>
          </table>
        </section>

        <section class="t-card">
          <h2>Boxes and singles</h2>
          ${sizes.length || summary.singles.paid + summary.singles.pending ? `
          <table class="t-table">
            <thead><tr><th></th><th>Paid</th><th>Pending</th><th>Total</th></tr></thead>
            <tbody>
              ${sizes.map((s) => `<tr><th scope="row">Box of ${s}</th><td>${summary.boxes[s].paid}</td><td>${summary.boxes[s].pending}</td><td><strong>${summary.boxes[s].paid + summary.boxes[s].pending}</strong></td></tr>`).join("")}
              <tr><th scope="row">Single cookies</th><td>${summary.singles.paid}</td><td>${summary.singles.pending}</td><td><strong>${summary.singles.paid + summary.singles.pending}</strong></td></tr>
            </tbody>
          </table>
          <p class="t-sub">Boxes are counted as boxes; single cookies are counted as cookies.</p>` : `<p class="t-sub">No boxes or singles yet.</p>`}
        </section>

        <section class="t-card">
          <h2>Batches to bake</h2>
          <label class="choice t-toggle"><input type="checkbox" id="inc-pending" ${includePending ? "checked" : ""}>
            <span>Include pending (unpaid) orders</span></label>
          <table class="t-table">
            <thead><tr><th></th><th>Cookies</th><th>Batches</th><th>Left over</th></tr></thead>
            <tbody>${batchRows}
              <tr class="t-sum"><th scope="row">Total batches</th><td></td><td><strong>${totalBatches}</strong></td><td></td></tr>
            </tbody>
          </table>
          <p class="t-sub">One batch = ${BATCH_SIZE} cookies. Leftover = spare cookies from the last batch of each flavor.</p>
        </section>`;

      $("inc-pending").addEventListener("change", (e) => { includePending = e.target.checked; render(); });
    }

    setupSundayPicker($("sunday"), (d) => { sunday = d; load(); });
    load();
  </script>
</body>
</html>
