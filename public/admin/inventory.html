<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Stock | AJ's Bakery admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon-64.png?v=3">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=4">
  <link rel="manifest" href="../site.webmanifest?v=4">
  <link rel="preload" href="../assets/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2B4C93">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin">

  <header class="site-header no-print">
    <div class="container admin-head">
      <a class="logo-link" href="/"><img src="../assets/stickers/logo-badge-new-96.webp" srcset="../assets/stickers/logo-badge-new-96.webp 96w, ../assets/stickers/logo-badge-new-192.webp 192w" sizes="56px" alt="" width="56" height="56"><span>AJ's Admin</span></a>
      <nav class="admin-nav" id="admin-nav" aria-label="Admin"></nav>
    </div>
  </header>

  <main class="container admin-main">
    <div class="ops-head" style="margin-bottom:.8rem">
      <h1 style="margin:0;font-size:1.6rem">Stock</h1>
      <button type="button" class="btn btn-small" id="add-btn">Add item</button>
    </div>

    <p class="t-sub" style="margin:0 0 .8rem">What you have at home. Tap <strong>+ Bought</strong> after every grocery run, and tap an item's name for its price, purchases and more.</p>
    <input type="search" id="search" class="admin-search no-print" placeholder="Find an item: butter, flour, bags..." aria-label="Find an item" autocomplete="off">
    <div class="form-error" id="message" role="alert" hidden></div>
    <div class="ops-ok ops-flash" id="flash" role="status" hidden></div>
    <div id="out"><p class="loading">Loading stock...</p></div>
  </main>

  <script type="module">
    // INVENTORY. Every purchase is a "lot" with its own price and expiry date; perishable items must have one.
    // Stock is used earliest-expiry-first. Stock and lots only change through database functions
    // (admin_receive_stock, admin_use_stock, admin_count_stock, admin_discard_lot, admin_fix_lot), which also write the log.
    // Two prices: the item's price = the LATEST you paid (menu pricing, shopping list);
    // each purchase keeps what YOU paid for it (real cost, profit, stock value).
    import { requireAdmin, renderNav, rpc, select, fail, fmtQty, num, peso2, shortDate, daysUntil, priceChange } from "../js/admin.js";
    import { getClient } from "../js/supabase.js";
    import { esc } from "../js/ui.js";

    await requireAdmin();
    renderNav("inventory");

    const $ = (id) => document.getElementById(id);
    let items = [];          // ingredient_stock rows
    let allLots = [];        // every purchase (not removed), newest first
    let log = [];            // recent stock movements
    let openForm = null;     // { id, kind, lot }  kind: receive | use | count | edit | fix   (id "new" = adding an item)
    let showHidden = false;
    const openItems = new Set();   // items tapped open (their details showing)
    let search = "";         // what's typed in the Find box

    const UNITS = [["g", "grams (g)"], ["ml", "millilitres (ml)"], ["pc", "pieces (pc)"], ["tsp", "teaspoons (tsp)"]];
    const UNIT_NAME = Object.fromEntries(UNITS.map(([u, t]) => [u, t]));
    const REASON = { received: "bought", used_in_batch: "used in batch", used_manual: "used", count_correction: "stock take", discarded: "thrown away", purchase_fix: "purchase fixed" };

    function showMessage(text) {
      $("message").textContent = text || ""; $("message").hidden = !text;
      if (text) $("message").scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function flash(text) {
      $("flash").textContent = text; $("flash").hidden = false;
      clearTimeout(flash.t); flash.t = setTimeout(() => { $("flash").hidden = true; }, 2500);
    }

    async function load() {
      try {
        [items, allLots, log] = await Promise.all([
          select("ingredient_stock", "*", (q) => q.order("category").order("name")),
          select("ingredient_lots", "id, ingredient_id, qty_received, qty_remaining, unit_cost, paid_total, pack_size_bought, received_on, expires_on, note",
                 (q) => q.eq("voided", false).order("received_on", { ascending: false }).order("id", { ascending: false }).limit(1000)),
          select("stock_log", "id, ingredient_id, delta, reason, note, created_at",
                 (q) => q.order("created_at", { ascending: false }).limit(15)),
        ]);
        render();
      } catch (err) {
        console.error(err);
        $("out").innerHTML = "";
        showMessage(err.isNetwork ? "Couldn't reach the server. Check your connection and refresh." : `Couldn't load stock: ${err.message}`);
      }
    }

    // ---- Drawing -------------------------------------------------------------------------
    // One short line per item: name, what state it's in, how much you have, and "+ Bought".
    // Tap the name to open the rest (price, purchases, used some / recount / edit).
    // Items that need you (expired, low, expiring this week) are listed first under "Needs attention".

    // What the line says under the name, and its color: bad = red, warn = amber, none = grey, ok = green
    function statusOf(i) {
      const days = i.next_expiry ? daysUntil(i.next_expiry) : null;
      if (i.expired_qty > 0) return { tone: "bad", text: `${fmtQty(i.expired_qty, i.unit)} past its expiry date` };
      if (i.is_low) return { tone: "warn", text: `Running low (buy more below ${fmtQty(i.reorder_level, i.unit)})` };
      if (days !== null && days <= 7) return { tone: "warn", text: days === 0 ? "Some expires today: use it first" : `Use some by ${shortDate(i.next_expiry)}` };
      if (!(Number(i.on_hand) > 0)) return { tone: "none", text: "None at home" };
      return { tone: "ok", text: "In stock" };
    }
    const needsYou = (i) => i.active && ["bad", "warn"].includes(statusOf(i).tone);

    function render() {
      const visible = items.filter((i) => (i.active || showHidden) && i.name.toLowerCase().includes(search.toLowerCase()));
      const active = items.filter((i) => i.active);
      const worth = active.reduce((s, i) => s + Number(i.stock_value || 0), 0);
      const guessed = active.filter((i) => !i.price_confirmed).length;
      const shelfEmpty = active.length && active.every((i) => !(Number(i.on_hand) > 0));

      // While searching, one plain list. Otherwise: Needs attention, then Ingredients, then Packaging.
      const attention = search ? [] : visible.filter(needsYou);
      const rest = visible.filter((i) => !attention.includes(i));
      const group = (title, rows, hint = "") => rows.length
        ? `<h2 class="inv-group">${title} <span class="o-small">(${rows.length})</span></h2>${hint}<div class="st-list">${rows.map(itemRow).join("")}</div>` : "";

      $("out").innerHTML = `
        ${search ? "" : `<p class="st-summary"><strong>${peso2(Math.round(worth))}</strong> worth on the shelf${guessed
          ? ` · <strong>${guessed}</strong> guessed price${guessed === 1 ? "" : "s"} <span class="o-small">(log a purchase to fix)</span>` : ""}</p>
        ${shelfEmpty ? `<div class="ops-note"><strong>Nothing is logged yet</strong>, so everything reads 0. Two ways to fill it in:
            tap an item and use <strong>Recount</strong> for what you already have at home, or <strong>+ Bought</strong> after shopping.
            Until then the Bake plan's shopping list will say to buy everything.</div>` : ""}`}
        ${openForm?.id === "new" ? `<section class="t-card"><h2>Add an item</h2>${editForm(null)}</section>` : ""}
        ${group("Needs attention", attention)}
        ${group(search ? "Found" : "Ingredients", search ? rest : rest.filter((i) => i.category === "ingredient"))}
        ${search ? "" : group("Packaging", rest.filter((i) => i.category === "packaging"),
            `<p class="t-sub" style="margin:-.2rem 0 .5rem">Bags, boxes, stickers, cards. The Bake plan adds them to the shopping list.</p>`)}
        ${visible.length ? "" : `<p class="t-sub">${search ? `Nothing called "${esc(search)}". Tap Add item to add it.` : "No items yet."}</p>`}
        <label class="choice t-toggle no-print" style="margin-top:1rem"><input type="checkbox" id="show-hidden" ${showHidden ? "checked" : ""}><span>Show hidden items</span></label>
        <details class="o-more st-log"><summary>Recent activity</summary>
          ${log.length ? log.map((r) => `<div class="lot-row"><span>${esc(byIdName(r.ingredient_id))}
              <span class="o-small">· ${esc(REASON[r.reason] || r.reason)}${r.note ? " · " + esc(r.note) : ""}</span></span>
              <span><strong>${r.delta > 0 ? "+" : "−"}${esc(fmtQty(Math.abs(r.delta), byIdUnit(r.ingredient_id)))}</strong>
              <span class="o-small">${esc(new Date(r.created_at).toLocaleDateString("en-US", { timeZone: "Asia/Manila", month: "short", day: "numeric" }))}</span></span></div>`).join("")
            : `<p class="t-sub">Nothing logged yet.</p>`}
        </details>`;
      wireReceiveForm();
      wireUnitForm();
    }
    const byIdName = (id) => items.find((x) => x.ingredient_id === id)?.name || "Item";
    const byIdUnit = (id) => items.find((x) => x.ingredient_id === id)?.unit || "";

    // One purchase, as a line: "Oct 12 · 2 kg for ₱200 (₱100 per bag) · 1.5 kg left · expires Nov 2"
    function purchaseRow(i, l) {
      const d = l.expires_on ? daysUntil(l.expires_on) : null;
      const size = Number(l.pack_size_bought || i.pack_size);
      const packs = Number(l.qty_received) / size;
      const price = l.paid_total != null
        ? `${peso2(l.paid_total)} (${peso2(l.paid_total / packs)} per ${l.pack_size_bought ? esc(fmtQty(size, i.unit)) + " pack" : esc(i.pack_label || "pack")})`
        : `<span class="o-small">no price entered</span>`;
      const left = l.qty_remaining > 0 ? `${esc(fmtQty(l.qty_remaining, i.unit))} left` : "used up";
      const fixing = openForm?.kind === "fix" && openForm.lot === l.id;
      return `<div class="lot-row lot-buy" data-lot="${l.id}"><span>
          <strong>${esc(shortDate(l.received_on))}</strong> · ${esc(fmtQty(l.qty_received, i.unit))} for ${price}
          <span class="o-small">· ${left}${l.expires_on ? " · expires " + esc(shortDate(l.expires_on)) : ""}${l.note ? " · " + esc(l.note) : ""}</span>
          ${d !== null && d < 0 && l.qty_remaining > 0 ? `<span class="tag tag-low">expired</span>` : d !== null && d <= 7 && l.qty_remaining > 0 ? `<span class="tag tag-warn">soon</span>` : ""}</span>
          <span class="lot-btns">
            <button type="button" class="btn btn-small btn-ghost" data-act="fix">Fix</button>
            ${l.qty_remaining > 0 ? `<button type="button" class="btn btn-small btn-ghost" data-act="discard">Throw away</button>` : ""}
          </span></div>
        ${fixing ? fixForm(i, l) : ""}`;
    }

    // "Last paid ₱87 for 1 kg (Ellie unbleached 1kg) · ₱0.09 per g". The brand/label is only added
    // when it says more than "pack" or "bag".
    function priceLine(i) {
      const size = Number(i.pack_size);
      const label = (i.pack_label || "").trim();
      const extra = label && !/^(per|pack|packs|bag|box|bottle|jar|can|tub|tray|piece|pc)\b/i.test(label) ? ` (${esc(label)})` : "";
      const lead = i.price_confirmed ? "Last paid" : "Guessed price:";
      if (size === 1) return `${lead} ${peso2(i.pack_price)} per ${esc(i.unit)}`;
      return `${lead} ${peso2(i.pack_price)} for ${esc(fmtQty(size, i.unit))}${extra} · ${peso2(i.cost_per_unit)} per ${esc(i.unit)}`;
    }

    function itemRow(i) {
      const st = statusOf(i);
      const itemLots = allLots.filter((l) => l.ingredient_id === i.ingredient_id);
      const shown = itemLots.filter((l, n) => l.qty_remaining > 0 || n < 6);      // everything with stock, plus the last few
      const formOpen = openForm?.id === i.ingredient_id;
      const open = formOpen || openItems.has(i.ingredient_id);
      const form = formOpen && openForm.kind !== "fix"
        ? ({ receive: receiveForm, use: useForm, count: countForm, edit: editForm, unit: unitForm }[openForm.kind])(i) : "";
      return `<article class="st-row st-${st.tone}${open ? " is-open" : ""}" data-ing="${i.ingredient_id}"${i.active ? "" : ' style="opacity:.6"'}>
        <div class="st-line">
          <button type="button" class="st-toggle" data-toggle aria-expanded="${open}">
            <span class="st-name">${esc(i.name)}${i.active ? "" : ` <span class="tag tag-info">hidden</span>`}</span>
            <span class="st-status">${esc(st.text)}${i.price_confirmed ? "" : ` · <span class="st-guess">price guessed</span>`}</span>
          </button>
          <span class="st-qty">${esc(fmtQty(i.on_hand, i.unit))}</span>
          <button type="button" class="btn btn-small no-print" data-open="receive" aria-label="I bought some ${esc(i.name)}">+ Bought</button>
        </div>
        ${open ? `<div class="st-body">
          <p class="o-small" style="margin:0 0 .3rem">${priceLine(i)}
            ${Number(i.stock_value) > 0 ? ` · worth ${peso2(i.stock_value)}` : ""}
            ${i.supplier ? ` · ${esc(i.supplier)}` : ""}
            ${i.reorder_level > 0 ? ` · buy more below ${esc(fmtQty(i.reorder_level, i.unit))}` : ""}
            ${i.category === "packaging" && Number(i.per_cookie) > 0 ? ` · ${num(i.per_cookie)} used per cookie baked` : ""}</p>
          <div class="ops-actions no-print" style="margin-top:.3rem">
            <button type="button" class="btn btn-small btn-ghost" data-open="use">Used some</button>
            <button type="button" class="btn btn-small btn-ghost" data-open="count">Recount</button>
            <button type="button" class="btn btn-small btn-ghost" data-open="edit">Edit</button>
          </div>
          ${form}
          ${itemLots.length ? `<details class="o-more no-print"${openForm?.kind === "fix" && formOpen ? " open" : ""}><summary>Purchases (${itemLots.length})</summary>
            ${shown.length ? `<p class="lot-head">Newest first. Typed something wrong? Tap Fix.</p>${shown.map((l) => purchaseRow(i, l)).join("")}` : ""}
            ${itemLots.length > shown.length ? `<p class="o-small">+ ${itemLots.length - shown.length} older purchase${itemLots.length - shown.length === 1 ? "" : "s"} (used up)</p>` : ""}
          </details>` : `<p class="o-small">No purchases logged yet.</p>`}
        </div>` : ""}
      </article>`;
    }

    // ---- Forms ---------------------------------------------------------------------------
    // "I bought some": packs x size = how much. Total fills itself in from the last price
    // (you just fix it if you paid something else) and says if the price went up or down.
    function receiveForm(i) {
      return `<form class="ops-form" data-form="receive">
        <div class="ops-field"><label>Packs bought</label><input name="packs" type="number" min="0" step="any" inputmode="decimal" value="1" required>
          <p class="field-hint" data-size-hint>1 pack = ${esc(fmtQty(i.pack_size, i.unit))} (${esc(i.pack_label || "pack")})</p></div>
        <div class="ops-field"><label>Total paid (₱)</label><input name="paid" type="number" min="0" step="any" inputmode="decimal"
          placeholder="${i.price_confirmed ? "" : "what you paid (the price is still a guess)"}">
          <p class="field-hint rc-sum" data-sum></p></div>
        <label class="choice wide"><input type="checkbox" name="other_size"><span>Different pack size this time</span></label>
        <div class="ops-field" data-size-field hidden><label>Size of one pack (${esc(i.unit)})</label><input name="size" type="number" min="0.001" step="any" inputmode="decimal" value="${esc(Number(i.pack_size))}"></div>
        <div class="ops-field"><label>Expiry date${i.perishable ? " (required)" : " (optional)"}</label><input name="expires" type="date"${i.perishable ? " required" : ""}></div>
        <div class="ops-field"><label>Where (optional)</label><input name="note" maxlength="200" placeholder="S&R, Landers, Shopee..."></div>
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">Add to stock</button><button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button></div>
      </form>`;
    }

    // Keep the receive form's total + summary up to date while typing
    function wireReceiveForm() {
      const form = document.querySelector('[data-form="receive"]');
      if (!form) return;
      const item = items.find((x) => x.ingredient_id === openForm.id);
      const paid = form.elements.paid;
      const update = () => {
        const packs = Number(form.elements.packs.value) || 0;
        const other = form.elements.other_size.checked;
        form.querySelector("[data-size-field]").hidden = !other;
        const size = other ? (Number(form.elements.size.value) || 0) : Number(item.pack_size);
        const qty = packs * size;
        form.querySelector("[data-size-hint]").textContent = qty > 0
          ? `= ${fmtQty(qty, item.unit)}${other ? "" : ` (1 pack = ${fmtQty(item.pack_size, item.unit)})`}`
          : `1 pack = ${fmtQty(item.pack_size, item.unit)}`;
        // Fill the total from the last real price until you type your own
        if (item.price_confirmed && paid.dataset.touched !== "1") {
          paid.value = qty > 0 ? Math.round(qty * Number(item.cost_per_unit) * 100) / 100 : "";
        }
        const total = paid.value === "" ? null : Number(paid.value);
        const sum = form.querySelector("[data-sum]");
        if (total === null) {
          sum.innerHTML = item.price_confirmed
            ? `No total = it uses the last price (${peso2(item.pack_price)} per ${esc(item.pack_label || "pack")}).`
            : `<span class="pc-up">Enter what you paid so the costs are real, not guessed.</span>`;
        } else if (qty > 0) {
          const perUsual = (total / qty) * Number(item.pack_size);
          sum.innerHTML = `${peso2(total / packs)} per ${other ? "pack" : esc(item.pack_label || "pack")}${other ? ` (= ${peso2(perUsual)} per usual ${esc(item.pack_label || "pack")})` : ""}`
            + (item.price_confirmed ? ` · ${priceChange(perUsual, item.pack_price)}` : "");
        }
      };
      paid.addEventListener("input", () => { paid.dataset.touched = "1"; update(); });
      form.addEventListener("input", (e) => { if (e.target !== paid) update(); });
      form.addEventListener("change", (e) => { if (e.target.name === "other_size") update(); });
      update();
    }

    function useForm(i) {
      return `<form class="ops-form" data-form="use">
        <div class="ops-field"><label>Amount used (${esc(i.unit)})</label><input name="qty" type="number" min="0" step="any" inputmode="decimal" required></div>
        <div class="ops-field"><label>Why (optional)</label><input name="note" maxlength="200" placeholder="test bake, gift, spilled..."></div>
        <div class="wide"><p class="field-hint">Batches you log on the Bake plan already use their ingredients. This is for everything else. Earliest-expiring stock goes first.</p></div>
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">Take out of stock</button><button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button></div>
      </form>`;
    }
    function countForm(i) {
      return `<form class="ops-form" data-form="count">
        <div class="ops-field"><label>How much is there really? (${esc(i.unit)})</label><input name="actual" type="number" min="0" step="any" inputmode="decimal" value="${esc(i.on_hand)}" required>
          <p class="field-hint">Logged: ${esc(fmtQty(i.on_hand, i.unit))}. Expired stock isn't counted.</p></div>
        ${i.perishable ? `<div class="ops-field"><label>Expiry date of the extra</label><input name="expires" type="date">
          <p class="field-hint">Only needed if you found more than logged.</p></div>` : ""}
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">Fix the count</button><button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button></div>
      </form>`;
    }
    // Fix one purchase: amount, total paid, expiry. Remove it if it never happened.
    function fixForm(i, l) {
      const used = Number(l.qty_received) - Number(l.qty_remaining);
      return `<form class="ops-form lot-fix" data-form="fix">
        <div class="ops-field"><label>Amount bought (${esc(i.unit)})</label><input name="qty" type="number" min="0.001" step="any" inputmode="decimal" value="${esc(Number(l.qty_received))}" required>
          ${used > 0 ? `<p class="field-hint">${esc(fmtQty(used, i.unit))} already used, so it can't go below that.</p>` : ""}</div>
        <div class="ops-field"><label>Total paid (₱)</label><input name="paid" type="number" min="0" step="any" inputmode="decimal" value="${l.paid_total ?? ""}" placeholder="leave blank to keep"></div>
        <div class="ops-field"><label>Expiry date${i.perishable ? " (required)" : ""}</label><input name="expires" type="date" value="${esc(l.expires_on || "")}"${i.perishable ? " required" : ""}></div>
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">Save fix</button>
          ${used === 0 ? `<button type="button" class="btn btn-small btn-ghost" data-act="remove">Remove this purchase</button>` : ""}
          <button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button></div>
      </form>`;
    }
    // Add (i = null) or edit an item. Unit can't change once an item exists (recipes depend on it).
    function editForm(i) {
      const v = (x) => esc(x ?? "");
      const isNew = !i;
      return `<form class="ops-form" data-form="${isNew ? "add" : "edit"}">
        <div class="ops-field wide"><label>Name</label><input name="name" maxlength="80" required value="${v(i?.name)}"></div>
        <div class="ops-field"><label>Type</label><select name="category"><option value="ingredient"${i?.category === "packaging" ? "" : " selected"}>Ingredient</option><option value="packaging"${i?.category === "packaging" ? " selected" : ""}>Packaging</option></select></div>
        ${isNew ? `<div class="ops-field"><label>Counted in</label><select name="unit">
          ${UNITS.map(([u, t]) => `<option value="${u}">${t}</option>`).join("")}</select></div>`
          : `<div class="ops-field"><label>Counted in</label><p class="unit-now"><strong>${esc(UNIT_NAME[i.unit] || i.unit)}</strong>
              <button type="button" class="link-btn" data-open="unit">Change</button></p></div>`}
        <div class="ops-field"><label>How it's sold</label><input name="pack_label" maxlength="40" placeholder="bag 2.5kg" value="${v(i?.pack_label)}"></div>
        <div class="ops-field"><label>Amount in one pack</label><input name="pack_size" type="number" min="0.001" step="any" inputmode="decimal" required value="${v(i?.pack_size ?? 1)}"><p class="field-hint">in the unit above, e.g. 2500 g</p></div>
        <div class="ops-field"><label>Price of one pack (₱)</label><input name="pack_price" type="number" min="0" step="any" inputmode="decimal" required value="${v(i?.pack_price ?? 0)}"><p class="field-hint">Updates by itself when you log a purchase with what you paid.</p></div>
        <div class="ops-field"><label>Reorder when below</label><input name="reorder_level" type="number" min="0" step="any" inputmode="decimal" value="${v(i?.reorder_level ?? 0)}"><p class="field-hint">0 = no alert</p></div>
        <div class="ops-field"><label>Used per cookie sold</label><input name="per_cookie" type="number" min="0" step="any" inputmode="decimal" value="${v(i?.per_cookie ?? 0)}"><p class="field-hint">packaging only, e.g. 1 bag</p></div>
        <div class="ops-field"><label>Supplier</label><input name="supplier" maxlength="120" value="${v(i?.supplier)}"></div>
        <label class="choice wide"><input type="checkbox" name="perishable"${i?.perishable ? " checked" : ""}><span>Has an expiry date (every purchase must have one)</span></label>
        <label class="choice wide"><input type="checkbox" name="price_confirmed"${i && !i.price_confirmed ? "" : " checked"}><span>The price above is the real price</span></label>
        ${isNew ? "" : `<label class="choice wide"><input type="checkbox" name="active"${i.active ? " checked" : ""}><span>Show this item (untick to hide it)</span></label>`}
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">${isNew ? "Add item" : "Save"}</button><button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button>
          ${isNew ? "" : `<button type="button" class="btn btn-small btn-ghost btn-danger-ghost" data-act="delete" style="margin-left:auto">Delete item</button>`}</div>
      </form>`;
    }

    // Change the unit (e.g. pieces -> grams). Every amount is converted in the database
    // (stock, purchases, history, recipes, pack size, reorder level); money stays the same.
    function unitForm(i) {
      return `<form class="ops-form" data-form="unit">
        <div class="ops-field"><label>Count it in</label><select name="unit">
          ${UNITS.filter(([u]) => u !== i.unit).map(([u, t]) => `<option value="${u}">${t}</option>`).join("")}</select></div>
        <div class="ops-field"><label data-factor-label>How many in one ${esc(i.unit)}?</label><input name="factor" type="number" min="0.001" step="any" inputmode="decimal" required>
          <p class="field-hint">e.g. 1 egg (pc) = 50 g, 1 tsp salt = 6 g, 1 g ≈ 1 ml</p></div>
        <div class="wide"><p class="field-hint" data-unit-preview></p></div>
        <div class="wide ops-actions"><button type="submit" class="btn btn-small">Change unit</button><button type="button" class="btn btn-small btn-ghost" data-close>Cancel</button></div>
      </form>`;
    }
    // Live preview: "500 g in stock becomes 10 pc. Recipes and the pack size change the same way."
    function wireUnitForm() {
      const form = document.querySelector('[data-form="unit"]'); if (!form) return;
      const item = items.find((x) => x.ingredient_id === openForm.id);
      const update = () => {
        const u = form.elements.unit.value, k = Number(form.elements.factor.value);
        form.querySelector("[data-factor-label]").textContent = `How many ${u} in one ${item.unit}?`;
        form.querySelector("[data-unit-preview]").textContent = k > 0
          ? `${fmtQty(item.on_hand, item.unit)} in stock becomes ${fmtQty(item.on_hand * k, u)}. One pack (${fmtQty(item.pack_size, item.unit)}) becomes ${fmtQty(item.pack_size * k, u)}. Recipes, purchases and the reorder level change the same way. Prices stay the same.`
          : "";
      };
      form.addEventListener("input", update); form.addEventListener("change", update); update();
    }

    // ---- Events --------------------------------------------------------------------------
    $("search").addEventListener("input", (e) => { search = e.target.value.trim(); render(); });

    $("add-btn").addEventListener("click", () => { openForm = { id: "new", kind: "edit" }; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });

    $("out").addEventListener("change", (e) => { if (e.target.id === "show-hidden") { showHidden = e.target.checked; render(); } });

    const errText = (err) => err.isNetwork ? "Couldn't reach the server. Nothing was changed." : err.message;

    $("out").addEventListener("click", async (e) => {
      const toggle = e.target.closest("[data-toggle]");
      if (toggle) {                                                // tap an item's name: show / hide its details
        const id = Number(toggle.closest("[data-ing]").dataset.ing);
        if (openItems.has(id) || openForm?.id === id) { openItems.delete(id); if (openForm?.id === id) openForm = null; }
        else openItems.add(id);
        render(); return;
      }
      const open = e.target.closest("[data-open]");
      if (open) {
        const id = Number(open.closest("[data-ing]").dataset.ing);
        openForm = (openForm?.id === id && openForm.kind === open.dataset.open) ? null : { id, kind: open.dataset.open };
        render(); return;
      }
      if (e.target.closest("[data-close]")) { openForm = null; render(); return; }

      const act = e.target.closest("[data-act]");
      if (!act) return;
      const lotId = Number(act.closest("[data-lot]")?.dataset.lot || act.closest(".lot-fix")?.previousElementSibling?.dataset.lot);

      if (act.dataset.act === "fix") {                              // open the fix form under that purchase
        const id = Number(act.closest("[data-ing]").dataset.ing);
        openForm = (openForm?.kind === "fix" && openForm.lot === lotId) ? null : { id, kind: "fix", lot: lotId };
        render(); return;
      }
      if (act.dataset.act === "discard") {                          // throw away what's left of one purchase
        if (!confirm("Throw away what's left of this purchase? It counts as waste.")) return;
        showMessage(""); act.disabled = true;
        try { await rpc("admin_discard_lot", { p_lot_id: lotId, p_note: "thrown away" }); flash("Thrown away"); await load(); }
        catch (err) { console.error(err); act.disabled = false; showMessage(errText(err)); }
        return;
      }
      if (act.dataset.act === "delete") {                           // delete an item (only if never used)
        const item = items.find((x) => x.ingredient_id === openForm?.id); if (!item) return;
        if (!confirm(`Delete ${item.name}? This can't be undone.`)) return;
        showMessage(""); act.disabled = true;
        try {
          await rpc("admin_delete_ingredient", { p_ingredient_id: item.ingredient_id });
          openForm = null; flash(`Deleted ${item.name}`); await load();
        } catch (err) {
          console.error(err); act.disabled = false;
          // Bought or used before: deleting would break old costs, so offer to hide it
          if (err.hint === "has_history" && confirm(`${err.message}\n\nHide it now? It disappears from the list and the shopping list; its history stays.`)) {
            const { error } = await getClient().from("ingredients").update({ active: false }).eq("id", item.ingredient_id);
            if (error) return showMessage(fail(error).message);
            openForm = null; flash(`Hid ${item.name}`); await load();
          } else showMessage(errText(err));
        }
        return;
      }
      if (act.dataset.act === "remove") {                           // purchase was a mistake
        if (!confirm("Remove this purchase completely? Use this if it never happened (a typo or a double entry).")) return;
        showMessage(""); act.disabled = true;
        try { await rpc("admin_fix_lot", { p_lot_id: openForm.lot, p_remove: true }); openForm = null; flash("Purchase removed"); await load(); }
        catch (err) { console.error(err); act.disabled = false; showMessage(errText(err)); }
      }
    });

    $("out").addEventListener("submit", async (e) => {
      const form = e.target.closest("[data-form]"); if (!form) return;
      e.preventDefault();
      const kind = form.dataset.form;
      const f = new FormData(form);
      const id = openForm?.id;
      const item = items.find((x) => x.ingredient_id === id);
      const num0 = (name) => Number(f.get(name));
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true; showMessage("");

      try {
        if (kind === "receive") {
          const other = f.has("other_size");
          const size = other ? num0("size") : Number(item.pack_size);
          const packs = num0("packs"), qty = packs * size;
          if (!(qty > 0)) throw new Error("Enter how many packs you bought.");
          const paid = f.get("paid") === "" ? null : num0("paid");
          await rpc("admin_receive_stock", {
            p_ingredient_id: id, p_qty: qty,
            p_unit_cost: paid === null ? null : paid / qty,        // total paid -> price per unit, so costing follows what you paid
            p_expires_on: f.get("expires") || null, p_note: f.get("note") || null,
            p_pack_size: other ? size : null,
          });
          flash(`Added ${fmtQty(qty, item.unit)} of ${item.name}`);
        } else if (kind === "use") {
          await rpc("admin_use_stock", { p_ingredient_id: id, p_qty: num0("qty"), p_note: f.get("note") || null });
          flash(`Took ${fmtQty(num0("qty"), item.unit)} of ${item.name} out of stock`);
        } else if (kind === "count") {
          await rpc("admin_count_stock", { p_ingredient_id: id, p_actual: num0("actual"), p_note: "stock take", p_expires_on: f.get("expires") || null });
          flash(`${item.name} is now ${fmtQty(num0("actual"), item.unit)}`);
        } else if (kind === "unit") {
          const u = f.get("unit"), k = num0("factor");
          if (!(k > 0)) throw new Error(`Say how many ${u} make one ${item.unit}.`);
          if (!confirm(`Change ${item.name} from ${item.unit} to ${u} (1 ${item.unit} = ${k} ${u})?\n\nStock, purchases, history and recipes are all converted.`)) { btn.disabled = false; return; }
          await rpc("admin_change_unit", { p_ingredient_id: id, p_unit: u, p_factor: k });
          flash(`${item.name} is now counted in ${u}`);
        } else if (kind === "fix") {
          const lot = allLots.find((l) => l.id === openForm.lot);
          const qty = num0("qty");
          const paid = f.get("paid") === "" ? null : num0("paid");
          const expires = f.get("expires") || null;
          await rpc("admin_fix_lot", {
            p_lot_id: lot.id, p_qty_received: qty,
            p_unit_cost: paid === null ? null : paid / qty,
            p_expires_on: expires, p_clear_expiry: !expires && !!lot.expires_on,
          });
          flash("Purchase fixed");
        } else {                                                   // add / edit an item (plain table write; RLS lets only admins)
          const row = {
            name: String(f.get("name")).trim(), category: f.get("category"),
            pack_label: String(f.get("pack_label") || "").trim() || null,
            pack_size: num0("pack_size"), pack_price: num0("pack_price"),
            reorder_level: num0("reorder_level") || 0, per_cookie: num0("per_cookie") || 0,
            supplier: String(f.get("supplier") || "").trim() || null,
            perishable: f.has("perishable"), price_confirmed: f.has("price_confirmed") && num0("pack_price") > 0,
          };
          if (!row.name) throw new Error("Give the item a name.");
          if (kind === "add") {
            row.unit = f.get("unit");
            const { error } = await getClient().from("ingredients").insert(row);
            if (error) throw error.code === "23505" ? new Error("You already have an item with that name.") : fail(error);
            flash("Added " + row.name);
          } else {
            row.active = f.has("active");
            if (!row.active && item.active) {
              // Hidden items are left off the shopping list, but a recipe still uses them when you mix
              const uses = await select("recipe_items", "id", (q) => q.eq("ingredient_id", id));
              if (uses.length && !confirm(`${item.name} is in a recipe. Hidden items are left off the shopping list, but mixing that recipe still uses it.\n\nHide it anyway? (Or take it out on the Recipes page first.)`)) { btn.disabled = false; return; }
            }
            const { error } = await getClient().from("ingredients").update(row).eq("id", id);
            if (error) throw error.code === "23505" ? new Error("You already have an item with that name.") : fail(error);
            flash("Saved " + row.name);
          }
        }
        openForm = null;
        await load();
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        showMessage(errText(err));
      }
    });

    load();
  </script>
</body>
</html>
