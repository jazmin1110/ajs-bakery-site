<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | AJ's Bakery</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#3a72b8">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#checkout">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="logo-link" href="index.html">
        <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
        <span>AJ's Bakery</span>
      </a>
      <button type="button" class="cart-btn" data-open-cart aria-label="Open your cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
          <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H6"/>
        </svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container checkout" id="checkout">
    <h1>Checkout</h1>

    <!-- Order summary: boxes, Sunday date, total. Drawn by the script below. -->
    <section class="summary" id="summary" aria-live="polite"></section>

    <!-- novalidate: we show our own friendly errors instead of the browser's pop-ups -->
    <form id="order-form" novalidate hidden>
      <div class="field" data-field="name">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
        <p class="field-error" id="name-error" role="alert"></p>
      </div>

      <div class="field" data-field="phone">
        <label for="phone">Mobile number</label>
        <div class="phone-input">
          <span class="phone-prefix" aria-hidden="true">+63</span>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                 placeholder="917 123 4567" maxlength="16" required aria-describedby="phone-error">
        </div>
        <p class="field-error" id="phone-error" role="alert"></p>
      </div>

      <div class="field" data-field="ig">
        <label for="ig">Instagram handle</label>
        <input id="ig" name="ig" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
               placeholder="@yourhandle" maxlength="31" required aria-describedby="ig-hint ig-error">
        <p class="field-hint" id="ig-hint">We confirm your order by Instagram message.</p>
        <p class="field-error" id="ig-error" role="alert"></p>
      </div>

      <fieldset class="field" data-field="fulfillment">
        <legend>Pickup or delivery?</legend>
        <label class="choice"><input type="radio" name="fulfillment" value="pickup"> <span>Pickup</span></label>
        <label class="choice"><input type="radio" name="fulfillment" value="delivery"> <span>Delivery</span></label>
        <p class="field-error" id="fulfillment-error" role="alert"></p>
      </fieldset>

      <div class="note-box" id="pickup-note" hidden></div>

      <div id="delivery-fields" hidden>
        <div class="field" data-field="address">
          <label for="address">Delivery address</label>
          <textarea id="address" name="address" rows="3" maxlength="300" autocomplete="street-address"
                    placeholder="Unit / street / barangay / city"></textarea>
          <p class="field-error" id="address-error" role="alert"></p>
        </div>
        <div class="note-box" id="delivery-note"></div>
      </div>

      <div class="field" data-field="gift">
        <label for="gift">Gift note <span class="optional">(optional)</span></label>
        <textarea id="gift" name="gift" rows="2" maxlength="500" placeholder="Happy birthday, Tita!"></textarea>
        <p class="field-hint">Goes on any box that doesn't already have its own note.</p>
      </div>

      <div class="form-error" id="form-error" role="alert" hidden></div>

      <button type="submit" class="btn btn-block" id="submit-btn">Place order</button>
      <p class="fine-print">Next you'll see how to pay by GCash.</p>
      <p class="fine-print">We only use your name, number, Instagram and address to prepare and deliver your order.</p>
    </form>
  </main>

  <script type="module">
    import { CONFIG } from "./js/config.js";
    import { fetchSundayInfo, fetchMenu, placeOrder } from "./js/supabase.js";
    import { orderingSunday, peso, esc } from "./js/ui.js";
    import * as cart from "./js/cart.js";
    import { initCartUI } from "./js/cart-ui.js";

    initCartUI({ showBar: false });

    const $ = (id) => document.getElementById(id);
    const form = $("order-form");
    const summary = $("summary");
    let ordering = null;       // this Sunday's info from the database (display only)
    let sending = false;       // true while the order request is in flight
    let done = false;          // true once the order is placed (page is about to change)
    let pricesUpdated = false; // true if today's menu changed what's in the cart

    // ---- Retry-safe order key --------------------------------------------------
    // If the connection drops after the database saved the order, the customer
    // taps "Try again". Sending the SAME key makes the database return the
    // order it already saved instead of making a duplicate. The key is reused
    // only while the order details are identical; change anything and you get
    // a fresh key (so an edited cart can never get an old order back).
    // Kept in sessionStorage so a page refresh before retrying is also safe.
    function keyFor(payload) {
      const json = JSON.stringify(payload);
      try {
        const saved = JSON.parse(sessionStorage.getItem("ajs-order-key") || "null");
        if (saved && saved.json === json) return saved.key;
      } catch (e) { /* storage blocked or corrupt: just make a new key */ }
      const key = crypto.randomUUID();
      try { sessionStorage.setItem("ajs-order-key", JSON.stringify({ json, key })); } catch (e) { /* fine */ }
      return key;
    }

    // ---- Order summary ------------------------------------------------------
    // All prices here are for display only: the database prices the real order.
    function renderSummary() {
      if (done) return;          // don't flash "cart is empty" while redirecting
      const boxes = cart.getBoxes();
      if (boxes.length === 0) {
        summary.innerHTML = `
          <p class="drawer-empty">Your cart is empty.</p>
          <a class="btn btn-block" href="index.html#boxes">Pick a box</a>`;
        form.hidden = true;
        return;
      }
      form.hidden = false;

      const cookies = boxes.reduce((n, b) => n + b.size, 0);
      let sundayHtml = `<p class="summary-sunday">Checking your Sunday...</p>`;
      if (ordering) {
        sundayHtml = `<p class="summary-sunday">Ready <strong>${esc(ordering.label)}</strong></p>`;
        if (cookies > ordering.remaining) {
          // Won't fit in what's left: the database will move the whole order to the next Sunday
          sundayHtml += `<p class="field-hint">That Sunday doesn't have room for all ${cookies} cookies, so your order may move to the following Sunday. We'll show the final date on the next screen.</p>`;
        }
      }

      summary.innerHTML = `
        ${sundayHtml}
        ${boxes.map((b, i) => `
          <div class="summary-box">
            <div class="cart-box-head">
              <strong>Box ${i + 1}: box of ${b.size}</strong>
              <span class="price">${peso(b.price)}</span>
            </div>
            <p class="cart-box-items">${b.items.map((it) => `${it.qty} × ${esc(it.name)}`).join("<br>")}</p>
            ${b.giftNote ? `<p class="cart-box-note">🎁 ${esc(b.giftNote)}</p>` : ""}
            ${b.unavailable ? `<p class="cart-box-warn">⚠ ${esc(b.unavailable.join(", "))} isn't available anymore.
              <button type="button" class="link-btn" data-remove-box="${esc(b.id)}">Remove this box</button></p>` : ""}
          </div>`).join("")}
        <div class="drawer-total"><span>Total</span><span class="price">${peso(cart.total())}</span></div>
        ${pricesUpdated ? `<p class="field-hint">Heads up: we updated the prices in your cart to match today's menu.</p>` : ""}
        <p class="field-hint">Final price is confirmed when you place your order.</p>`;

      // Can't order while a box has something we no longer sell
      const blocked = boxes.some((b) => b.unavailable);
      $("submit-btn").disabled = blocked || sending;
      if (blocked) showFormError("One of your boxes has a flavor we no longer offer. Please remove it above (or rebuild it) to continue.", false);
      else if (!sending) $("form-error").hidden = true;
    }

    summary.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove-box]");
      if (btn) cart.remove(btn.dataset.removeBox);
    });

    // Check the cart against today's menu (flavor removed? price changed?). Best effort:
    // the database re-checks everything when the order is placed anyway.
    fetchMenu()
      .then((menu) => { pricesUpdated = cart.syncWithMenu(menu).changed; renderSummary(); })
      .catch((err) => console.error(err));

    // Load the Sunday date, then draw. The page works even if this fails.
    renderSummary();
    fetchSundayInfo()
      .then((info) => { ordering = orderingSunday(info); renderSummary(); })
      .catch((err) => console.error(err));
    window.addEventListener("cart:changed", renderSummary);

    // ---- Pickup / delivery toggle ------------------------------------------
    $("pickup-note").textContent = CONFIG.pickupArea;
    $("delivery-note").textContent =
      `You'll book Lalamove or Grab for the Sunday ${CONFIG.pickupWindow} window; delivery fee is paid by you.`;

    function updateFulfillment() {
      const v = form.fulfillment.value;
      $("pickup-note").hidden = v !== "pickup";
      $("delivery-fields").hidden = v !== "delivery";
    }
    form.querySelectorAll('input[name="fulfillment"]').forEach((r) => r.addEventListener("change", updateFulfillment));

    // ---- Field cleaning + validation ---------------------------------------
    // Mobile: accept 9171234567, 09171234567, 639171234567 or +63 917 123 4567.
    // Returns the number in +639XXXXXXXXX form, or null if it doesn't look right.
    function cleanPhone(raw) {
      let d = raw.replace(/[\s\-().+]/g, "");
      if (!/^\d+$/.test(d)) return null;
      if (d.startsWith("63")) d = d.slice(2);
      else if (d.startsWith("0")) d = d.slice(1);
      return /^9\d{9}$/.test(d) ? "+63" + d : null;
    }

    // Instagram: add the @ if they forgot it. Letters, numbers, dots, underscores, up to 30.
    function cleanIg(raw) {
      const h = raw.trim().replace(/^@*/, "");
      return /^[A-Za-z0-9._]{1,30}$/.test(h) ? "@" + h : null;
    }

    function setError(field, message) {
      const input = form.querySelector(`[data-field="${field}"] input:not([type=radio]), [data-field="${field}"] textarea`);
      $(`${field}-error`).textContent = message || "";
      if (input) input.setAttribute("aria-invalid", message ? "true" : "false");
    }

    // Returns the cleaned values, or null after showing errors (and focusing the first bad field)
    function validate() {
      const v = {};
      const problems = [];
      const fail = (field, msg, focusSel) => { setError(field, msg); problems.push(focusSel); };

      ["name", "phone", "ig", "fulfillment", "address"].forEach((f) => setError(f, ""));

      v.name = $("name").value.trim();
      if (!v.name) fail("name", "Please tell us your name.", "#name");

      v.phone = cleanPhone($("phone").value);
      if (!v.phone) fail("phone", "Please enter a Philippine mobile number, like 917 123 4567.", "#phone");

      v.igHandle = cleanIg($("ig").value);
      if (!v.igHandle) fail("ig", "Please enter your Instagram handle, like @yourhandle.", "#ig");

      v.fulfillment = form.fulfillment.value;
      if (!v.fulfillment) fail("fulfillment", "Please choose pickup or delivery.", 'input[name="fulfillment"]');

      v.address = $("address").value.trim();
      if (v.fulfillment === "delivery" && v.address.length < 8) {
        fail("address", "Please enter your full delivery address.", "#address");
      }
      if (v.fulfillment !== "delivery") v.address = "";

      if (problems.length) { form.querySelector(problems[0]).focus(); return null; }
      return v;
    }

    // Tidy the Instagram box as they leave it, so they see the @ appear
    $("ig").addEventListener("blur", () => { const h = cleanIg($("ig").value); if (h) $("ig").value = h; });

    // ---- Friendly messages for database errors -------------------------------
    function showFormError(html, scroll = true) {
      const box = $("form-error");
      box.innerHTML = html;
      box.hidden = false;
      if (scroll) box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function explain(err) {
      if (err.isNetwork) {
        return `We couldn't reach our server. Your cart is still saved. Check your connection and tap <strong>Try again</strong>.
          Still not working? DM us on Instagram <a href="${esc(CONFIG.instagramUrl)}" target="_blank" rel="noopener">${esc(CONFIG.instagramHandle)}</a> and we'll take your order there.`;
      }
      switch (err.hint) {
        case "sunday_full":
          return `${esc(err.message)} Please message us on Instagram and we'll fit you in.`;
        case "wrong_quantity":
        case "unknown_flavor":
        case "invalid_box":
        case "invalid_items":
          return `Something in your cart changed (${esc(err.message)}) <a href="index.html#boxes">Go back to the menu</a> to rebuild that box. Your other boxes are still saved.`;
        case "invalid_name": setError("name", err.message); return "";
        case "invalid_phone": setError("phone", err.message); return "";
        case "address_required": setError("address", err.message); return "";
        case "invalid_boxes":
        case "note_too_long":
        case "too_many_open_orders":
          return esc(err.message);
        default:
          return `Something went wrong placing your order. Please try again, or message us on Instagram.`;
      }
    }

    // Back button after ordering: browsers can restore this page frozen mid-submit
    // (button stuck on "Placing your order..."). Reload so it reflects the real, now-empty cart.
    window.addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });

    // ---- Submit ---------------------------------------------------------------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (sending) return;                       // ignore double taps
      $("form-error").hidden = true;

      const values = validate();
      if (!values) return;

      const boxes = cart.getBoxes();
      if (boxes.length === 0) return renderSummary();
      if (boxes.some((b) => b.unavailable)) return renderSummary();   // shows the "remove it" message

      // The checkout note goes on boxes that don't have their own note
      const sharedNote = $("gift").value.trim();
      const withNotes = boxes.map((b) => ({ ...b, giftNote: b.giftNote || sharedNote }));

      sending = true;
      const btn = $("submit-btn");
      btn.disabled = true;                       // stops a second order being placed
      btn.textContent = "Placing your order...";

      try {
        const payload = { ...values, boxes: withNotes };
        const order = await placeOrder({ ...payload, idempotencyKey: keyFor(payload) });
        done = true;
        cart.clear();                            // only after the database accepted it
        try { localStorage.setItem("ajs-last-ref", order.ref_code); sessionStorage.removeItem("ajs-order-key"); } catch (e) { /* storage blocked: fine */ }
        location.href = `confirmed.html?ref=${encodeURIComponent(order.ref_code)}`;
        // (button stays disabled while the browser navigates)
      } catch (err) {
        console.error(err);
        const html = explain(err);
        if (html) showFormError(html);
        else form.querySelector('[aria-invalid="true"]')?.focus();
        sending = false;
        btn.disabled = false;
        btn.textContent = err.isNetwork ? "Try again" : "Place order";
      }
    });
  </script>
</body>
</html>
